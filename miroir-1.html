<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16111a">
<title>Miroir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d4; --surface:#f7f0e2; --surface-2:#e6dbc4; --ink:#2a1d22; --ink-soft:#6b5a5f;
  --line:#cdbd9f; --blood:#8b1c26; --blood-ink:#8b1c26; --brass:#8a6a2f; --on-blood:#f7f0e2;
  --shadow:rgba(42,29,34,.18);
  --serif:"EB Garamond", Garamond, "Iowan Old Style", Georgia, serif;
  --gothic:"UnifrakturMaguntia", "Old English Text MT", "EB Garamond", Georgia, serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16111a; --surface:#211a25; --surface-2:#2c2331; --ink:#e8dfd0; --ink-soft:#a99eaf;
    --line:#3e3345; --blood:#9e2230; --blood-ink:#dd6a72; --brass:#c4a26a; --on-blood:#f3e9da;
    --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16111a; --surface:#211a25; --surface-2:#2c2331; --ink:#e8dfd0; --ink-soft:#a99eaf;
  --line:#3e3345; --blood:#9e2230; --blood-ink:#dd6a72; --brass:#c4a26a; --on-blood:#f3e9da;
  --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%; font-family:var(--serif); font-size:1.125rem; line-height:1.45;
  color:var(--ink); background:var(--bg);
  background-image:radial-gradient(ellipse at 50% -10%, var(--surface-2) 0%, transparent 60%);
  background-attachment:fixed;
  font-variant-numeric:lining-nums tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.wrap{ max-width:1080px; margin:0 auto; padding:0 1rem 7rem; }

/* ---------- Écran liste ---------- */
.home-head{ text-align:center; padding:3rem 0 1.5rem; }
.wordmark{ font-family:var(--gothic); font-weight:400; font-size:clamp(4rem,18vw,6.5rem); line-height:1; margin:0; color:var(--ink); letter-spacing:.01em; }
.home-sub{ margin:.5rem 0 0; color:var(--ink-soft); font-style:italic; }
.char-list{ list-style:none; margin:1.5rem auto 0; padding:0; max-width:560px; }
.char-list li + li{ border-top:1px solid var(--line); }
.char-link{ display:flex; align-items:center; gap:1rem; width:100%; text-align:left; padding:1rem .25rem; }
.char-link:hover .char-name{ color:var(--blood-ink); }
.char-name{ font-size:1.35rem; font-weight:500; display:block; line-height:1.2; }
.char-meta{ color:var(--ink-soft); font-size:1rem; }
.home-actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:.75rem; margin:2rem auto 0; max-width:560px; }
.empty{ text-align:center; color:var(--ink-soft); margin:2rem auto 0; max-width:30rem; }
.theme-switch{ display:block; margin:3rem auto 0; color:var(--ink-soft); font-size:1rem; text-decoration:underline; text-underline-offset:3px; }

/* ---------- Boutons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-height:44px; padding:.5rem 1.1rem; border-radius:3px; border:1px solid var(--line); background:var(--surface); font-weight:500; }
.btn:hover{ border-color:var(--brass); }
.btn-primary{ background:var(--blood); border-color:var(--blood); color:var(--on-blood); }
.btn-primary:hover{ filter:brightness(1.1); border-color:var(--blood); }
.btn-danger{ color:var(--blood-ink); border-color:var(--blood-ink); background:transparent; }
.btn-quiet{ border-color:transparent; background:transparent; color:var(--ink-soft); }
.btn-block{ width:100%; }

/* ---------- Miroir (portrait) ---------- */
.mirror{ flex:none; width:64px; height:82px; border-radius:50%; border:2px solid var(--brass);
  box-shadow:0 0 0 3px var(--bg), 0 0 0 4px var(--brass), 0 6px 18px var(--shadow);
  background:radial-gradient(ellipse at 40% 30%, var(--surface-2), var(--bg) 75%);
  display:grid; place-items:center; overflow:hidden; }
.mirror span{ font-family:var(--gothic); font-size:2.2rem; color:var(--brass); line-height:1; }
.mirror.lg{ width:92px; height:118px; }
.mirror.lg span{ font-size:3.2rem; }
.mirror img{ width:100%; height:100%; object-fit:cover; display:block; }
button.mirror{ cursor:pointer; padding:0; }
button.mirror:hover{ border-color:var(--blood-ink); }
.mirror.reveal span, .mirror.reveal img{ animation:clear 1.1s ease-out both; }
.mirror.xl{ width:140px; height:180px; margin:0 auto 1.25rem; }
.mirror.xl span{ font-size:4.8rem; }
.file-btn{ position:relative; overflow:hidden; }
.file-btn input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
@keyframes clear{ from{ opacity:.15; filter:blur(8px); transform:scale(1.15);} to{ opacity:1; filter:blur(0); transform:none; } }
@media (prefers-reduced-motion: reduce){ .mirror.reveal span, .mirror.reveal img{ animation:none; } }

/* ---------- Fiche ---------- */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  background:var(--bg); border-bottom:1px solid var(--line); margin:0 -1rem; padding:.35rem .5rem; }
.topbar .btn-quiet{ min-height:44px; padding:.4rem .6rem; }
.sheet-head{ display:flex; align-items:center; gap:1.25rem; padding:1.5rem 0 1rem; }
.char-title{ font-family:var(--gothic); font-weight:400; font-size:clamp(2rem,8vw,2.8rem); line-height:1.05; margin:0; overflow-wrap:anywhere; }
.char-sub{ margin:.3rem 0 0; color:var(--ink-soft); }
.vitals{ display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.vital{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:.6rem .25rem; min-height:72px; text-align:center; }
.vital + .vital{ border-left:1px solid var(--line); }
.vital b{ font-size:1.5rem; font-weight:500; line-height:1.1; }
.vital small{ font-size:.85rem; color:var(--ink-soft); line-height:1.15; }
.states{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem 1.5rem; padding:.9rem 0; }
.toggle{ display:inline-flex; align-items:center; gap:.6rem; min-height:44px; }
.toggle .pip{ width:22px; height:22px; }
.stepper{ display:inline-flex; align-items:center; gap:.4rem; }
.stepper button{ width:40px; height:40px; border:1px solid var(--line); border-radius:50%; font-size:1.3rem; line-height:1; background:var(--surface); }
.stepper output{ min-width:1.5em; text-align:center; font-size:1.25rem; font-weight:600; }
.exh-note{ width:100%; margin:0; font-size:1rem; color:var(--blood-ink); font-style:italic; }

.abilities{ display:grid; gap:1rem; margin-top:.5rem; }
@media (min-width:640px){ .abilities{ grid-template-columns:repeat(2,1fr); } .vitals{ max-width:640px; } }
@media (min-width:1000px){ .abilities{ grid-template-columns:repeat(3,1fr); } }
.ability{ background:var(--surface); border:1px solid var(--line); border-radius:4px; }
.ab-head{ display:flex; align-items:center; gap:.9rem; width:100%; text-align:left; padding:.75rem 1rem; border-bottom:1px solid var(--line); }
.ab-mod{ font-size:2rem; font-weight:500; line-height:1; min-width:2.4ch; }
.ab-name{ flex:1; font-size:1.2rem; font-weight:600; }
.ab-score{ min-width:2.6rem; height:2.6rem; display:grid; place-items:center; border:1px solid var(--brass); border-radius:50%; font-size:1.05rem; color:var(--brass); }
.rows{ list-style:none; margin:0; padding:.25rem 0; }
.row{ display:flex; align-items:center; gap:.25rem; padding:0 .5rem 0 .25rem; }
.row-name{ flex:1; }
.row-name.save{ font-style:italic; }
.prof{ width:44px; height:40px; display:grid; place-items:center; flex:none; }
.pip{ width:16px; height:16px; border-radius:50%; border:1.5px solid var(--ink-soft); display:block; position:relative; }
.pip.p1{ background:var(--ink); border-color:var(--ink); }
.pip.p2{ background:var(--blood); border-color:var(--blood); box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--blood); }
.pip.half{ background:linear-gradient(90deg, var(--ink-soft) 50%, transparent 50%); }
.pip.on{ background:var(--brass); border-color:var(--brass); }
.row-val{ min-width:4rem; min-height:40px; text-align:right; font-size:1.15rem; font-weight:500; padding:0 .5rem; border-radius:3px; }
.row-val:hover, .vital:hover{ background:var(--surface-2); }
.forced{ color:var(--brass); font-size:.8em; margin-left:.1em; vertical-align:super; }
.notes-area{ width:100%; min-height:60vh; margin-top:1rem; padding:1rem; background:var(--surface); border:1px solid var(--line); border-radius:4px; line-height:1.55; resize:vertical; }

/* ---------- Onglets ---------- */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; justify-content:center; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar button{ flex:1; max-width:220px; min-height:56px; font-size:1.05rem; color:var(--ink-soft); border-top:2px solid transparent; }
.tabbar button[aria-current="page"]{ color:var(--ink); border-top-color:var(--blood); font-weight:600; }

/* ---------- Feuille modale ---------- */
.overlay{ position:fixed; inset:0; z-index:20; background:rgba(10,6,12,.55); display:flex; align-items:flex-end; justify-content:center; }
.panel{ width:100%; max-width:520px; max-height:88%; overflow:auto; background:var(--surface); border-top:2px solid var(--brass);
  border-radius:10px 10px 0 0; padding:1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom,0px)); box-shadow:0 -10px 40px var(--shadow); }
@media (min-width:640px){ .overlay{ align-items:center; } .panel{ border-radius:6px; border:1px solid var(--line); border-top:2px solid var(--brass); } }
.panel h2{ font-weight:600; font-size:1.4rem; margin:0 0 1rem; }
.panel p{ margin:0 0 1rem; }
.field{ display:block; margin-bottom:.9rem; }
.field > span{ display:block; font-size:.95rem; color:var(--ink-soft); margin-bottom:.2rem; }
.input{ width:100%; min-height:44px; padding:.45rem .7rem; background:var(--bg); border:1px solid var(--line); border-radius:3px; }
.input:focus{ border-color:var(--brass); outline:none; }
.big-input{ font-size:2rem; text-align:center; font-weight:500; }
.cols{ display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
.class-row{ display:grid; grid-template-columns:1fr 4.5rem 44px; gap:.5rem; align-items:end; margin-bottom:.5rem; }
.class-row .sub{ grid-column:1 / 3; }
.check{ display:flex; align-items:center; gap:.6rem; min-height:44px; margin-bottom:.5rem; }
.check input{ width:22px; height:22px; accent-color:var(--blood); }
.actions{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.25rem; }
.actions .btn{ flex:1; }
.breakdown{ list-style:none; margin:0 0 1rem; padding:0; border-top:1px solid var(--line); }
.breakdown li{ display:flex; justify-content:space-between; padding:.35rem 0; border-bottom:1px solid var(--line); }
.breakdown li.total{ font-weight:600; }
.hint{ font-size:.95rem; color:var(--ink-soft); }
.divider{ border:0; border-top:1px solid var(--line); margin:1.5rem 0 1rem; }
.score-step{ display:grid; grid-template-columns:56px 1fr 56px; gap:.6rem; align-items:center; }
.score-step button{ height:56px; border:1px solid var(--line); border-radius:50%; font-size:1.6rem; background:var(--bg); }
textarea.input{ min-height:8rem; font-size:1rem; }

/* ---------- Sorts ---------- */
.conc-band{ display:flex; align-items:center; gap:.5rem; margin:0 0 1rem; padding:.25rem .25rem .25rem .9rem; border:1px solid var(--line); border-left:3px solid var(--blood); background:var(--surface); border-radius:3px; }
.conc-txt{ flex:1; min-width:0; min-height:48px; text-align:left; display:flex; flex-direction:column; justify-content:center; line-height:1.2; }
.conc-txt small{ color:var(--ink-soft); font-size:.9rem; }
.conc-txt b{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sec-head{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; flex-wrap:wrap; margin:1.75rem 0 .4rem; }
.sec-head h2{ font-size:1.35rem; font-weight:600; margin:0; }
.sec-tools{ display:flex; flex-wrap:wrap; }
.sec-tools .btn{ min-height:44px; padding:.3rem .6rem; font-size:1rem; }
.slots{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.slot-row{ display:flex; align-items:center; gap:.25rem; border-bottom:1px solid var(--line); }
.slot-lv{ flex:none; width:5.5rem; min-height:48px; text-align:left; padding:0 .25rem; display:flex; flex-direction:column; justify-content:center; line-height:1.15; }
.slot-lv small{ color:var(--ink-soft); font-size:.85rem; }
.slot-pips{ display:flex; flex-wrap:wrap; flex:1; }
.slot-pip{ width:44px; height:48px; display:grid; place-items:center; }
.slot-pip i{ display:block; width:17px; height:17px; transform:rotate(45deg); border:1.5px solid var(--ink); background:var(--ink); border-radius:2px; transition:background .15s; }
.slot-pip.spent i{ background:transparent; border-color:var(--ink-soft); }
.slot-count{ flex:none; color:var(--ink-soft); font-size:1rem; padding-right:.25rem; }
.spell-search{ margin-bottom:.6rem; }
.chips{ display:flex; gap:.4rem; overflow-x:auto; margin:0 -1rem; padding:0 1rem .5rem; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; min-height:40px; padding:.25rem .9rem; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:1rem; white-space:nowrap; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.selects{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin:.1rem 0 .5rem; }
.selects .input{ min-height:40px; padding:.25rem .5rem; font-size:1rem; }
.lvl-head{ font-size:1.05rem; font-weight:500; font-style:italic; color:var(--ink-soft); margin:1.25rem 0 .2rem; }
.spells{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.spell{ border-bottom:1px solid var(--line); }
.spell-row{ display:flex; align-items:center; }
.spell-open{ flex:1; min-width:0; display:flex; align-items:center; gap:.5rem; min-height:56px; padding:.35rem .25rem; text-align:left; }
.spell-open:hover .spell-name{ color:var(--blood-ink); }
.spell-main{ flex:1; min-width:0; }
.spell-name{ display:block; font-size:1.15rem; font-weight:500; line-height:1.2; }
.spell-meta{ display:block; color:var(--ink-soft); font-size:.95rem; line-height:1.25; }
.marks{ display:flex; gap:.25rem; flex:none; }
.mark{ min-width:1.6rem; height:1.6rem; padding:0 .35rem; display:grid; place-items:center; border:1px solid var(--line); border-radius:3px; font-size:.85rem; color:var(--ink-soft); }
.mark.c{ border-color:var(--blood-ink); color:var(--blood-ink); }
.spell.is-conc .spell-name::after{ content:" ◆"; color:var(--blood-ink); font-size:.8em; }
.spell-body{ padding:0 .5rem 1rem 44px; max-width:44rem; }
.spell-facts{ display:grid; grid-template-columns:auto 1fr; gap:.15rem 1rem; margin:0 0 .8rem; font-size:1rem; }
.spell-facts dt{ color:var(--ink-soft); }
.spell-facts dd{ margin:0; }
.spell-desc p{ margin:0 0 .6rem; line-height:1.55; }
.spell-desc .up{ font-weight:600; }
.spell-actions{ display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.8rem; }
.cast-opts{ display:flex; flex-direction:column; gap:.5rem; }
.cast-opt{ justify-content:space-between; text-align:left; gap:1rem; }
.cast-opt small{ color:var(--ink-soft); font-size:.95rem; font-weight:400; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn:disabled:hover{ border-color:var(--line); }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 .75rem; }
.field small.hint{ display:block; margin-top:.15rem; }
.field.missing .input{ border-color:var(--brass); border-width:2px; }
.field.missing > span::after{ content:" (non trouvé)"; color:var(--brass); }
.panel textarea.input.tall{ min-height:12rem; }
/* ---------- Combat ---------- */
.armor-line{ display:flex; align-items:center; gap:.75rem; width:100%; text-align:left; padding:.55rem .25rem; border-bottom:1px solid var(--line); min-height:56px; }
.armor-line:hover{ background:var(--surface-2); }
.al-main{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25; }
.al-main small{ color:var(--ink-soft); font-size:.9rem; }
.al-main b{ font-weight:500; }
.al-main small.warn{ color:var(--blood-ink); }
.al-edit{ flex:none; color:var(--ink-soft); font-size:1rem; text-decoration:underline; text-underline-offset:3px; }
.hp-card{ margin:1.1rem 0 .25rem; padding:.8rem 1rem 1rem; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--blood); border-radius:4px; }
.hp-line{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; min-height:1.8rem; }
.hp-lbl{ color:var(--ink-soft); font-size:1rem; }
.hp-temp{ font-size:.95rem; color:var(--brass); border:1px solid var(--brass); border-radius:999px; padding:0 .65rem; }
.hp-nums{ display:flex; align-items:baseline; gap:.3rem; margin:0 0 .55rem; }
.hp-cur{ font-size:3.4rem; font-weight:500; line-height:1; }
.hp-card.low .hp-cur{ color:var(--blood-ink); }
.hp-sep{ font-size:1.7rem; color:var(--ink-soft); }
.hp-max{ font-size:1.7rem; color:var(--ink-soft); min-height:44px; padding:0 .3rem; border-radius:3px; }
.hp-max:hover{ background:var(--surface-2); }
.hp-bar{ height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-bottom:.9rem; }
.hp-bar i{ display:block; height:100%; background:var(--blood); transition:width .35s ease-out; }
@media (prefers-reduced-motion: reduce){ .hp-bar i{ transition:none; } }
.hp-btns{ display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; }
.hp-btns .btn{ padding:.5rem .3rem; }
.death{ margin:.1rem 0 1rem; }
.death-state{ margin:0 0 .3rem; font-weight:600; color:var(--blood-ink); font-size:1.15rem; }
.death-row{ display:flex; align-items:center; justify-content:space-between; }
.dpips{ display:flex; }
.dpip{ width:44px; height:44px; display:grid; place-items:center; }
.dpip i{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--ink-soft); display:block; }
.dpip.s.on i{ background:var(--ink); border-color:var(--ink); }
.dpip.f.on i{ background:var(--blood); border-color:var(--blood); }
.death .hint{ margin:.4rem 0 .7rem; }
.turn-bar{ display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-top:1.4rem; padding:.4rem 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.turn-bar .hint{ margin:0; }
.turn-bar .btn{ flex:none; white-space:nowrap; }
.turn-tog{ display:inline-flex; align-items:center; gap:.45rem; min-height:44px; padding:0 .4rem; color:var(--ink-soft); font-size:1rem; }
.turn-tog[aria-pressed="true"]{ color:var(--brass); }
.turn-tog .pip{ width:18px; height:18px; }
.lvl-head small{ font-style:normal; font-size:.9rem; margin-left:.35rem; }
.atk-bonus{ flex:none; width:3.4rem; text-align:center; font-size:1.45rem; font-weight:500; line-height:1; }
.atk-bonus small{ display:block; font-size:.75rem; color:var(--ink-soft); font-weight:400; margin-top:.2rem; }
div.spell-open{ cursor:default; }
.cb-list .spell-body{ padding-left:.5rem; }
.cast-btn{ flex:none; min-height:40px; padding:.25rem .8rem; font-size:1rem; margin-left:.25rem; }
.add-line{ margin:.35rem 0 0; font-size:1rem; padding-left:.25rem; }
.feat-pips{ display:flex; flex-wrap:wrap; align-items:center; margin:-.35rem 0 .25rem; }
.feat-count{ color:var(--ink-soft); font-size:1rem; padding:0 .5rem; }
.feat-pips .btn-quiet{ min-width:44px; font-size:1.3rem; }
.rest-btns{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.warn{ color:var(--blood-ink); font-style:italic; }
.t-short{ display:none; }
@media (max-width:560px){ .t-long{ display:none; } .t-short{ display:inline; } }
/* ---------- Sac, états, dés de vie ---------- */
button, label, a{ touch-action:manipulation; }
.panel{ overscroll-behavior:contain; }
html.sheet-open, html.sheet-open body{ overflow:hidden; }
.cond-band{ display:flex; flex-direction:column; justify-content:center; width:100%; min-height:48px; text-align:left; margin:0 0 1rem;
  padding:.3rem .9rem; border:1px solid var(--line); border-left:3px solid var(--brass); background:var(--surface); border-radius:3px; line-height:1.2; }
.cond-band small{ color:var(--ink-soft); font-size:.9rem; }
.cond-band b{ font-weight:600; }
.cond-band:hover{ border-color:var(--brass); }
.cond-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.cond-list li{ border-bottom:1px solid var(--line); }
.cond{ display:flex; gap:.8rem; align-items:flex-start; padding:.65rem .1rem; cursor:pointer; }
.cond input{ flex:none; width:22px; height:22px; margin:.2rem 0 0; accent-color:var(--blood); }
.cond b{ display:block; font-weight:600; }
.cond small{ display:block; color:var(--ink-soft); font-size:.95rem; line-height:1.35; margin-top:.1rem; }
.cond input:checked + span b{ color:var(--blood-ink); }
.coins{ display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.coin{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:68px; padding:.4rem .1rem; min-width:0; }
.coin + .coin{ border-left:1px solid var(--line); }
.coin b{ font-size:1.3rem; font-weight:500; line-height:1.1; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.coin small{ color:var(--ink-soft); font-size:.85rem; }
.coin.po b{ color:var(--brass); }
.coin:hover{ background:var(--surface-2); }
.wealth{ color:var(--ink-soft); font-size:1rem; }
.qty{ flex:none; display:flex; align-items:center; }
.qty button{ width:40px; height:48px; font-size:1.35rem; line-height:1; color:var(--ink-soft); }
.qty button:hover:not(:disabled){ color:var(--ink); }
.qty button:disabled{ opacity:.35; cursor:not-allowed; }
.qty output{ min-width:2.2ch; text-align:center; font-weight:600; font-size:1.1rem; }
.item.used-up .spell-name{ color:var(--ink-soft); text-decoration:line-through; text-decoration-thickness:1px; }
.item .spell-body{ padding-left:.5rem; }
.load{ margin:1.75rem 0 0; }
.load-line{ display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; margin-bottom:.4rem; }
.load-line b{ font-weight:600; font-size:1.1rem; }
.load-line span{ color:var(--ink-soft); font-size:1rem; }
.load .hp-bar{ margin-bottom:.5rem; }
.load .hp-bar i{ background:var(--brass); }
.load.over .hp-bar i{ background:var(--blood); }
.load p{ margin:0 0 .4rem; }
.sr-hp{ display:flex; align-items:baseline; gap:.35rem; }
.sr-hp b{ font-size:2.2rem; font-weight:500; line-height:1; }
.sr-hp span{ color:var(--ink-soft); }
.sr-log{ margin-top:1rem; }
.backup-note{ max-width:560px; margin:1.75rem auto 0; padding:.7rem 1rem; border-left:3px solid var(--brass); background:var(--surface); font-size:1rem; }
.theme-switch + .theme-switch{ margin-top:.9rem; }
.install h3{ font-size:1.1rem; font-weight:600; margin:1rem 0 .2rem; }
.install p{ margin:0 0 .6rem; }
@media (max-width:400px){ .tabbar button{ font-size:1rem; } .coin b{ font-size:1.15rem; } }
.toast{ position:fixed; left:50%; bottom:calc(72px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:30; max-width:calc(100% - 2rem);
  background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:4px; font-size:1rem; box-shadow:0 6px 20px var(--shadow); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>

  const su = (raw && raw.slots) || {};
  c.slots = {used:{}, pact: clamp(parseInt(su.pact)||0, 0, 9)};
  for (let n = 1; n <= 9; n++){ const u = parseInt(su.used && su.used[n]) || 0; if (u > 0) c.slots.used[n] = clamp(u, 0, 9); }
  const cc = raw && raw.concentration;
  c.concentration = cc && cc.name ? {id:String(cc.id||""), name:String(cc.name)} : null;
  c.combat = normCombat(raw && raw.combat);
  c.inventory = (Array.isArray(raw && raw.inventory) ? raw.inventory : []).map(normItem);
  const rm = (raw && raw.money) || {};
  c.money = {}; for (const [k] of COINS) c.money[k] = clamp(parseInt(rm[k]) || 0, 0, 9999999);
  const rh = (raw && raw.hitDice) || {};
  c.hitDice = {}; for (const z of [6, 8, 10, 12]){ const u = parseInt(rh[z]) || 0; if (u > 0) c.hitDice[z] = clamp(u, 0, 20); }
  const rcd = Array.isArray(raw && raw.conditions) ? raw.conditions : [];
  c.conditions = CONDITIONS.map(x => x.k).filter(k => rcd.includes(k));
  c.schema = SCHEMA;
  return c;
}
function normSpell(s){
  s = s || {};
  const str = k => String(s[k] ?? "").trim();
  return {
    id: String(s.id || uid()), name: str("name"), level: clamp(parseInt(s.level)||0, 0, 9),
    school: SCHOOLS.includes(s.school) ? s.school : "",
    castTime: str("castTime"), time: TIMES.some(t => t[0] === s.time) ? s.time : "action",
    range: str("range"), components: str("components"), duration: str("duration"),
    concentration: !!s.concentration, ritual: !!s.ritual, prepared: !!s.prepared, always: !!s.always,
    description: String(s.description ?? "").trim(), higher: String(s.higher ?? "").trim()
  };
}
function normCombat(rc){
  rc = rc && typeof rc === "object" ? rc : {};
  const int = (v, a, b) => clamp(parseInt(v) || 0, a, b);
  const ds = rc.death || {}, tu = rc.turn || {};
  return {
    dmg: int(rc.dmg, 0, 9999),            // PV perdus : suit automatiquement les changements de PV max
    temp: int(rc.temp, 0, 999),
    death: {s: int(ds.s, 0, 3), f: int(ds.f, 0, 3)},
    armor: ARMOR[rc.armor] ? rc.armor : "none",
    armorMagic: int(rc.armorMagic, -5, 5), shield: !!rc.shield, shieldMagic: int(rc.shieldMagic, -5, 5),
    acMisc: int(rc.acMisc, -10, 10), tough: !!rc.tough,
    weapons: (Array.isArray(rc.weapons) ? rc.weapons : []).map(normWeapon),
    features: (Array.isArray(rc.features) ? rc.features : []).map(normFeature),
    turn: {a: !!tu.a, b: !!tu.b, r: !!tu.r}
  };
}
function normWeapon(w){
  w = w || {};
  const str = k => String(w[k] ?? "").trim();
  const int = (k, a, b) => clamp(parseInt(w[k]) || 0, a, b);
  return {
    id: String(w.id || uid()), name: str("name"), base: WEAPON_BY[w.base] ? w.base : "",
    kind: w.kind === "ranged" ? "ranged" : "melee",
    ability: AB_NAME[w.ability] ? w.ability : "auto",
    prof: w.prof !== false, magic: int("magic", -5, 5), atkMisc: int("atkMisc", -20, 20), dmgMisc: int("dmgMisc", -20, 20),
    dice: str("dice") || "1d4", dtype: str("dtype"), props: str("props"),
    mastery: MASTERY[w.mastery] ? w.mastery : "", masteryOn: !!w.masteryOn,
    notes: String(w.notes ?? "").trim()
  };
}
function normFeature(f){
  f = f || {};
  const max = clamp(parseInt(f.max) || 0, 0, 99);
  return {
    id: String(f.id || uid()), name: String(f.name ?? "").trim(),
    time: FEAT_TIMES.some(t => t[0] === f.time) ? f.time : "other",
    max, used: clamp(parseInt(f.used) || 0, 0, max),
    recharge: RECHARGE[f.recharge] ? f.recharge : "long",
    desc: String(f.desc ?? "").trim()
  };
}
const numIn = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
function normItem(it){
  it = it || {};
  return {
    id: String(it.id || uid()), name: String(it.name ?? "").trim(),
    qty: clamp(parseInt(it.qty ?? 1) || 0, 0, 99999),
    weight: clamp(Math.round(numIn(it.weight) * 1000) / 1000, 0, 9999),
    attuned: !!it.attuned, notes: String(it.notes ?? "").trim()
  };
}
function hitDicePool(c){
  const t = {};
  for (const k of c.classes){ const z = HIT_DIE[norm(k.name)] || 8; t[z] = (t[z] || 0) + k.level; }
  return Object.keys(t).map(Number).sort((a, b) => b - a)
    .map(z => ({z, total: t[z], used: clamp(c.hitDice[z] || 0, 0, t[z])}));
}
function hasWM(c){ return c.classes.some(k => WM_CLASSES.includes(norm(k.name))); }
function curHp(c, d){ const max = d.out["hp.max"].value; return clamp(max - c.combat.dmg, 0, max); }
function casterInfo(c){
  let cl = 0, wl = 0, ab = null; const parts = [];
  for (const k of c.classes){
    const n = norm(k.name), lv = k.level, sub = norm(k.subclass);
    let add = 0;
    if (CASTER[n] === "full") add = lv;
    else if (CASTER[n] === "half") add = Math.ceil(lv / 2);
    else if (n === "guerrier" && /occult|eldritch/.test(sub)) add = Math.floor(lv / 3);
    else if (n === "roublard" && /arcan|trickster/.test(sub)) add = Math.floor(lv / 3);
    if (n === "occultiste") wl += lv;
    if (add){ cl += add; parts.push([k.name + " " + lv, add]); }
    if (!ab) ab = CAST_AB[n] || (add ? "int" : null);
  }
  return {cl: Math.min(cl, 20), wl: Math.min(wl, 20), parts, ab};
}
function totalLevel(c){ return c.classes.reduce((s,k)=>s + (parseInt(k.level)||0), 0) || 1; }
function classLine(c){
  return c.classes.filter(k=>k.name).map(k => esc(k.name) + " " + k.level + (k.subclass ? " (" + esc(k.subclass) + ")" : "")).join(" / ") || "Classe à définir";
}

/* ================= Moteur de calcul ================= */
function derive(c){
  const out = {};
  const put = (key, calc, parts) => {
    const forced = Object.prototype.hasOwnProperty.call(c.overrides, key);
    out[key] = {calc, value: forced ? c.overrides[key] : calc, forced, parts};
    return out[key].value;
  };
  const lvl = totalLevel(c);
  const pbCalc = 2 + Math.floor((clamp(lvl,1,20) - 1) / 4);
  const pb = put("pb", pbCalc, [["Niveau total " + lvl, null], ["Bonus de maîtrise", pbCalc]]);
  const m = {};
  for (const a of ABILITIES) m[a.k] = Math.floor((c.abilities[a.k] - 10) / 2);
  const exh = c.exhaustion * 2;
  const exhPart = exh ? [["Épuisement", -exh]] : [];
  const half = Math.floor(pb / 2);

  for (const a of ABILITIES){
    const p = c.saves[a.k];
    put("save." + a.k, m[a.k] + (p ? pb : 0) - exh,
      [["Mod. " + a.n, m[a.k]], ...(p ? [["Maîtrise", pb]] : []), ...exhPart]);
  }
  for (const s of SKILLS){
    const p = c.skills[s.k] || 0;
    let bonus = 0, label = null;
    if (p === 2){ bonus = pb * 2; label = "Expertise"; }
    else if (p === 1){ bonus = pb; label = "Maîtrise"; }
    else if (c.jackOfAllTrades){ bonus = half; label = "Touche-à-tout"; }
    put("skill." + s.k, m[s.a] + bonus - exh,
      [["Mod. " + AB_NAME[s.a], m[s.a]], ...(label ? [[label, bonus]] : []), ...exhPart]);
  }
  put("init", m.dex + (c.jackOfAllTrades ? half : 0) - exh,
    [["Mod. Dextérité", m.dex], ...(c.jackOfAllTrades ? [["Touche-à-tout", half]] : []), ...exhPart]);
  // Le score passif n'est pas un jet de d20 : l'épuisement ne s'applique pas.
  const perc = out["skill.perception"];
  const percNoExh = perc.forced ? perc.value : perc.calc + exh;
  put("passive", 10 + percNoExh, [["Base", 10], ["Perception (hors épuisement)", percNoExh]]);
  const worn = ARMOR[c.combat.armor];
  const heavyPen = worn && worn.str && c.abilities.for < worn.str ? 3 : 0;
  const sp = Math.max(0, c.speed - 1.5 * c.exhaustion - heavyPen);
  const stuck = c.conditions.map(k => COND_BY[k]).find(x => x && x.still);
  put("speed", stuck ? 0 : sp, [["Vitesse de base", c.speed], ...(c.exhaustion ? [["Épuisement", -1.5 * c.exhaustion]] : []),
    ...(heavyPen ? [["Armure trop lourde (Force " + worn.str + ")", -3]] : []),
    ...(stuck && sp ? [[stuck.n + " : vitesse 0", -sp]] : [])]);
  // Magie
  const ci = casterInfo(c);
  const ab = c.spellcasting.ability || ci.ab;
  if (ab){
    put("spell.dc", 8 + pb + m[ab], [["Base", 8], ["Maîtrise", pb], ["Mod. " + AB_NAME[ab], m[ab]]]);
    put("spell.atk", pb + m[ab] - exh, [["Maîtrise", pb], ["Mod. " + AB_NAME[ab], m[ab]], ...exhPart]);
  }
  const base = FULL_SLOTS[ci.cl] || [];
  const slots = [0];
  for (let n = 1; n <= 9; n++) slots[n] = put("slots." + n, base[n-1] || 0, []);
  const pt = PACT[ci.wl] || [0,0];
  const pact = {count: put("pact.count", pt[0], []), level: put("pact.level", pt[1], [])};
  // Points de vie : maximum du dé au niveau 1 de la première classe, puis moyenne fixe
  const hpParts = []; let hpCalc = 0;
  c.classes.forEach((k, i) => {
    const n = norm(k.name), die = HIT_DIE[n] || 8, avg = die / 2 + 1;
    const v = i === 0 ? die + avg * (k.level - 1) : avg * k.level;
    hpCalc += v;
    hpParts.push([(k.name || "Classe") + " " + k.level + " (d" + die + (HIT_DIE[n] ? "" : " supposé") + ")", v]);
  });
  hpCalc += m.con * lvl; hpParts.push(["Constitution " + sign(m.con) + " × " + lvl, m.con * lvl]);
  if (norm(c.species) === "nain"){ hpCalc += lvl; hpParts.push(["Ténacité naine", lvl]); }
  if (c.combat.tough){ hpCalc += 2 * lvl; hpParts.push(["Robuste", 2 * lvl]); }
  put("hp.max", Math.max(lvl, hpCalc), hpParts);
  // Classe d'armure
  const cb = c.combat, arm = ARMOR[cb.armor];
  let acCalc, acParts;
  if (arm){
    const dx = arm.cat === "L" ? m.dex : arm.cat === "I" ? Math.min(m.dex, 2) : 0;
    acCalc = arm.ac + dx; acParts = [[arm.n, arm.ac]];
    if (arm.cat !== "H") acParts.push(["Mod. Dextérité" + (arm.cat === "I" ? " (max 2)" : ""), dx]);
    if (cb.armorMagic){ acCalc += cb.armorMagic; acParts.push(["Armure magique", cb.armorMagic]); }
  } else {
    const cls = c.classes.map(k => norm(k.name));
    let best = {v: 10 + m.dex, p: [["Sans armure", 10], ["Mod. Dextérité", m.dex]]};
    if (cls.includes("barbare") && 10 + m.dex + m.con > best.v)
      best = {v: 10 + m.dex + m.con, p: [["Défense sans armure (barbare)", 10], ["Mod. Dextérité", m.dex], ["Mod. Constitution", m.con]]};
    if (cls.includes("moine") && !cb.shield && 10 + m.dex + m.sag > best.v)
      best = {v: 10 + m.dex + m.sag, p: [["Défense sans armure (moine)", 10], ["Mod. Dextérité", m.dex], ["Mod. Sagesse", m.sag]]};
    acCalc = best.v; acParts = best.p;
  }
  if (cb.shield){ acCalc += 2 + cb.shieldMagic; acParts.push(["Bouclier", 2 + cb.shieldMagic]); }
  if (cb.acMisc){ acCalc += cb.acMisc; acParts.push(["Autres bonus", cb.acMisc]); }
  put("ac", acCalc, acParts);
  return {lvl, m, out, ab, ci, slots, pact};
}
const LABELS = {pb:"Bonus de maîtrise", init:"Initiative", passive:"Perception passive", speed:"Vitesse",
  "spell.dc":"DD de sauvegarde des sorts", "spell.atk":"Attaque avec un sort",
  ac:"Classe d'armure", "hp.max":"Points de vie maximum"};
function labelFor(key){
  if (LABELS[key]) return LABELS[key];
  const [kind, k] = key.split(".");
  if (kind === "save") return "Sauvegarde de " + AB_NAME[k];
  if (kind === "skill") return (SKILLS.find(s=>s.k===k)||{}).n;
  return key;
}

/* ================= Stockage ================= */
let chars = [];
let view = {screen:"list", id:null, tab:"stats", reveal:false};
let storageOk = true;

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : null;
    chars = (data && Array.isArray(data.characters) ? data.characters : []).map(migrate);
  } catch(e){ storageOk = false; chars = []; }
}
let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({miroir:SCHEMA, characters:chars}));
      storageOk = true;
    } catch(e){
      if (storageOk) toast("Enregistrement impossible sur cet appareil. Exporte tes fiches pour ne rien perdre.");
      storageOk = false;
    }
  }, 250);
}
function current(){ return chars.find(c => c.id === view.id); }
function touch(c){ c.updatedAt = Date.now(); persist(); }

/* ================= Thème ================= */
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function getTheme(){ try { return localStorage.getItem(THEME_KEY) || "auto"; } catch(e){ return "auto"; } }
function setTheme(t){ try { localStorage.setItem(THEME_KEY, t); } catch(e){} applyTheme(t); }
const THEME_NEXT = {auto:"dark", dark:"light", light:"auto"};
const THEME_LABEL = {auto:"Thème : suit l'appareil", dark:"Thème : nuit", light:"Thème : parchemin"};

/* ================= Rendu ================= */
function render(){
  const app = $("#app");
  if (view.screen === "sheet" && current()) app.innerHTML = renderSheet(current());
  else { view.screen = "list"; app.innerHTML = renderList(); }
  view.reveal = false;
  try { localStorage.setItem(VIEW_KEY, JSON.stringify(view.screen === "sheet" ? {id:view.id, tab:view.tab} : {})); } catch(e){}
}

function mirrorInner(c){
  return c.portrait ? `<img src="${esc(c.portrait)}" alt="">` : `<span>${initial(c.name)}</span>`;
}
function initial(name){ const t = String(name||"?").trim(); return esc(t ? t[0].toUpperCase() : "?"); }

function renderList(){
  const items = [...chars].sort((a,b)=>b.updatedAt - a.updatedAt).map(c => `
    <li><button class="char-link" data-action="open" data-id="${c.id}">
      <span class="mirror" aria-hidden="true">${mirrorInner(c)}</span>
      <span><span class="char-name">${esc(c.name) || "Sans nom"}</span>
      <span class="char-meta">${classLine(c)}${c.species ? ", " + esc(c.species).toLowerCase() : ""}</span></span>
    </button></li>`).join("");
  return `
    <header class="home-head">
      <h1 class="wordmark">Miroir</h1>
      <p class="home-sub">Fiches de personnage, D&amp;D 2024</p>
    </header>
    ${chars.length ? `<ul class="char-list">${items}</ul>` :
      `<p class="empty">Aucun personnage sur cet appareil. Crée le tien, ou importe une fiche sauvegardée.</p>`}
    <div class="home-actions">
      <button class="btn btn-primary" data-action="new">Créer un personnage</button>
      <button class="btn" data-action="import">Importer</button>
      ${chars.length ? `<button class="btn" data-action="export-all">Tout exporter</button>` : ""}
    </div>
    ${backupNote()}
    <button class="theme-switch" data-action="theme">${THEME_LABEL[getTheme()]}</button>
    <button class="theme-switch" data-action="install">Mettre Miroir sur l'écran d'accueil</button>`;
}

function derivedBtn(d, key, text, cls){
  const o = d.out[key];
  return `<button class="${cls}" data-action="derived" data-key="${key}" aria-label="${esc(labelFor(key))} : ${esc(text)}${o.forced ? ", valeur forcée" : ""}">${text}${o.forced ? '<span class="forced" aria-hidden="true">†</span>' : ""}</button>`;
}

function renderSheet(c){
  const d = derive(c);
  const tab = view.tab;
  const sub = [c.species, c.background].filter(Boolean).map(esc).join(", ");
  let body = "";
  if (tab === "combat"){
    body = renderCombat(c, d);
  } else if (tab === "spells"){
    body = renderSpells(c, d);
  } else if (tab === "bag"){
    body = renderBag(c);
  } else if (tab === "notes"){
    body = `<label class="sr" for="notes">Notes</label>
      <textarea id="notes" class="notes-area" data-input="notes" placeholder="Allés, ennemis, dettes, secrets…">${esc(c.notes)}</textarea>`;
  } else {
    const o = d.out;
    const exhNote = c.exhaustion === 6 ? "Épuisement 6 : le personnage meurt."
      : c.exhaustion ? `Jets de d20 ${sign(-c.exhaustion*2)} (déjà inclus dans les valeurs), vitesse réduite de ${meters(c.exhaustion*1.5)}.` : "";
    body = `
      <div class="vitals">
        ${derivedBtn(d,"pb",`<b>${sign(o.pb.value)}</b><small>Maîtrise</small>`,"vital")}
        ${derivedBtn(d,"init",`<b>${sign(o.init.value)}</b><small>Initiative</small>`,"vital")}
        ${derivedBtn(d,"speed",`<b>${meters(o.speed.value)}</b><small>Vitesse</small>`,"vital")}
        ${derivedBtn(d,"passive",`<b>${o.passive.value}</b><small>Perception passive</small>`,"vital")}
      </div>
      <div class="states">
        <button class="toggle" data-action="inspi" aria-pressed="${c.heroicInspiration}">
          <span class="pip ${c.heroicInspiration ? "on" : ""}" aria-hidden="true"></span>Inspiration héroïque
        </button>
        <div class="stepper" role="group" aria-label="Épuisement">
          <span>Épuisement</span>
          <button data-action="exh" data-delta="-1" aria-label="Réduire l'épuisement">−</button>
          <output>${c.exhaustion}</output>
          <button data-action="exh" data-delta="1" aria-label="Augmenter l'épuisement">+</button>
        </div>
        ${exhNote ? `<p class="exh-note">${exhNote}</p>` : ""}
      </div>
      <div class="abilities">${ABILITIES.map(a => renderAbility(c, d, a)).join("")}</div>`;
  }
  return `
    <nav class="topbar">
      <button class="btn btn-quiet" data-action="back">‹ Personnages</button>
      <span>
        <button class="btn btn-quiet" data-action="export-one">Exporter</button>
        <button class="btn btn-quiet" data-action="identity">Modifier</button>
      </span>
    </nav>
    <header class="sheet-head">
      <button class="mirror lg ${view.reveal ? "reveal" : ""}" data-action="portrait" aria-label="${c.portrait ? "Changer le portrait" : "Ajouter un portrait"}">${mirrorInner(c)}</button>
      <div>
        <h1 class="char-title">${esc(c.name) || "Sans nom"}</h1>
        <p class="char-sub">${classLine(c)}${sub ? "<br>" + sub : ""}</p>
      </div>
    </header>
    ${concBand(c)}
    ${condBand(c)}
    ${body}
    <nav class="tabbar" aria-label="Sections de la fiche">
      <button data-action="tab" data-tab="stats" ${tab==="stats" ? 'aria-current="page"' : ""}><span class="t-long">Caractéristiques</span><span class="t-short">Carac.</span></button>
      <button data-action="tab" data-tab="combat" ${tab==="combat" ? 'aria-current="page"' : ""}>Combat</button>
      <button data-action="tab" data-tab="spells" ${tab==="spells" ? 'aria-current="page"' : ""}>Sorts</button>
      <button data-action="tab" data-tab="bag" ${tab==="bag" ? 'aria-current="page"' : ""}>Sac</button>
      <button data-action="tab" data-tab="notes" ${tab==="notes" ? 'aria-current="page"' : ""}>Notes</button>
    </nav>`;
}

function pip(level, halfOn){
  const cls = level === 2 ? "p2" : level === 1 ? "p1" : halfOn ? "half" : "";
  return `<span class="pip ${cls}" aria-hidden="true"></span>`;
}
const PROF_TXT = ["aucune maîtrise", "maîtrise", "expertise"];

function renderAbility(c, d, a){
  const mod = d.m[a.k];
  const save = d.out["save." + a.k];
  const rows = [`
    <li class="row">
      <button class="prof" data-action="cycle-save" data-ab="${a.k}" aria-label="Sauvegarde de ${a.n} : ${c.saves[a.k] ? "maîtrise" : "aucune maîtrise"}. Changer.">${pip(c.saves[a.k] ? 1 : 0)}</button>
      <span class="row-name save">Sauvegarde</span>
      ${derivedBtn(d, "save." + a.k, sign(save.value), "row-val")}
    </li>`];
  for (const s of SKILLS.filter(s => s.a === a.k)){
    const lv = c.skills[s.k] || 0;
    rows.push(`
    <li class="row">
      <button class="prof" data-action="cycle-skill" data-skill="${s.k}" aria-label="${s.n} : ${PROF_TXT[lv]}. Changer.">${pip(lv, c.jackOfAllTrades)}</button>
      <span class="row-name">${s.n}</span>
      ${derivedBtn(d, "skill." + s.k, sign(d.out["skill." + s.k].value), "row-val")}
    </li>`);
  }
  return `
    <section class="ability" aria-label="${a.n}">
      <button class="ab-head" data-action="score" data-ab="${a.k}" aria-label="${a.n} ${c.abilities[a.k]}, modificateur ${sign(mod)}. Modifier la valeur.">
        <span class="ab-mod">${sign(mod)}</span>
        <span class="ab-name">${a.n}</span>
        <span class="ab-score">${c.abilities[a.k]}</span>
      </button>
      <ul class="rows">${rows.join("")}</ul>
    </section>`;
}

/* ================= Feuilles modales ================= */
let sheetClose = null;
function openSheet(html, onMount){
  const root = $("#sheet-root");
  root.innerHTML = `<div class="overlay" data-overlay><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;
  const panel = root.querySelector(".panel");
  onMount && onMount(panel);
  const f = panel.querySelector("[autofocus], input, select, textarea, button");
  f && f.focus();
  document.documentElement.classList.add("sheet-open");
  sheetClose = () => { root.innerHTML = ""; sheetClose = null; document.documentElement.classList.remove("sheet-open"); };
}
function closeSheet(){ sheetClose && sheetClose(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

}

/* --- Portrait --- */
function resizePortrait(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const W = 320, H = 410, ratio = W / H;             // même proportion que l'ovale
        let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
        if (sw / sh > ratio){ const nw = sh * ratio; sx = (sw - nw) / 2; sw = nw; }
        else { const nh = sw / ratio; sy = (sh - nh) * 0.35; sh = nh; } // cadrage un peu haut : le visage
        const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL("image/jpeg", 0.82));
      } catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
function sheetPortrait(){
  const c = current(); if (!c) return;
  openSheet(`
    <h2>Portrait</h2>
    <span class="mirror xl" aria-hidden="true" id="pv">${mirrorInner(c)}</span>
    <p class="hint">La photo est recadrée dans l'ovale et allégée pour tenir sur l'appareil. Elle est incluse dans les exports.</p>
    <div class="actions" style="flex-direction:column">
      <label class="btn btn-primary btn-block file-btn">${c.portrait ? "Choisir une autre photo" : "Choisir une photo"}
        <input type="file" accept="image/*" id="pf" aria-label="Choisir une photo"></label>
      ${c.portrait ? `<button class="btn btn-block" id="prm">Retirer la photo</button>` : ""}
      <button class="btn btn-quiet btn-block" data-action="close">Fermer</button>
    </div>`, panel => {
    panel.querySelector("#pf").addEventListener("change", async e => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      if (!file.type.startsWith("image/")){ toast("Ce fichier n'est pas une image."); return; }
      try {

  });

/* ================= Sorts ================= */
function defaultSF(){ return {q:"", lvl:"all", prep:false, conc:false, rit:false, time:"all", school:"", sort:"level"}; }
function ensureSpellView(){ view.sf = view.sf || defaultSF(); view.openSpells = view.openSpells || new Set(); }
function guessTime(s){
  const n = norm(s);
  if (/bonus/.test(n)) return "bonus";
  if (/reaction/.test(n)) return "reaction";
  if (/action/.test(n)) return "action";
  return n ? "other" : "action";
}
function spellMeta(s){
  const sc = s.school ? ", " + s.school.toLowerCase() : "";
  return (s.level ? "Niveau " + s.level : "Tour de magie") + sc;
}
function paras(txt){
  return String(txt || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
}
function startConc(c, s){
  const prev = c.concentration;
  c.concentration = {id:s.id, name:s.name};
  return prev && prev.id !== s.id ? `Concentration sur ${prev.name} rompue.` : "";
}

function concBand(c){
  if (!c.concentration) return "";

}

function slotRow(kind, lv, max, used, label, sub, forced){
  used = clamp(used, 0, max);
  const left = max - used;
  let pips = "";
  for (let i = 0; i < max; i++){
    const av = i < left;
    pips += `<button class="slot-pip${av ? "" : " spent"}" data-action="slot" data-kind="${kind}" data-lv="${lv}" data-state="${av ? "avail" : "spent"}" aria-label="${esc(label)} : emplacement ${av ? "disponible. Le dépenser." : "dépensé. Le récupérer."}"><i></i></button>`;
  }
  return `<li class="slot-row">
    <button class="slot-lv" data-action="slots-adjust" aria-label="${esc(label)}${sub ? ", " + esc(sub) : ""}. Ajuster les emplacements."><span>${esc(label)}${forced ? '<span class="forced" aria-hidden="true">†</span>' : ""}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</button>
    <span class="slot-pips">${pips}</span>
    <span class="slot-count" aria-hidden="true">${left}/${max}</span>
  </li>`;
}

function renderSpells(c, d){
  ensureSpellView();
  const o = d.out, ab = d.ab, f = view.sf;
  const prepCount = c.spells.filter(s => s.level > 0 && (s.prepared || s.always)).length;
  const dash = label => `<div class="vital"><b>—</b><small>${label}</small></div>`;
  const vitals = `<div class="vitals">
    ${ab ? derivedBtn(d, "spell.dc", `<b>${o["spell.dc"].value}</b><small>DD des sorts</small>`, "vital") : dash("DD des sorts")}
    ${ab ? derivedBtn(d, "spell.atk", `<b>${sign(o["spell.atk"].value)}</b><small>Attaque</small>`, "vital") : dash("Attaque")}
    <button class="vital" data-action="cast-ab" aria-label="Caractéristique d'incantation : ${ab ? AB_NAME[ab] : "aucune"}. Changer."><b>${ab ? AB_SHORT[ab] : "—"}</b><small>Incantation</small></button>
    <div class="vital"><b>${prepCount}</b><small>Préparés</small></div>
  </div>
  ${ab ? "" : `<p class="hint">Touche « Incantation » pour choisir la caractéristique qui sert au DD et à l'attaque de tes sorts.</p>`}`;

  const rows = [];
  for (let n = 1; n <= 9; n++){
    const max = d.slots[n];
    if (max > 0) rows.push(slotRow("std", n, max, c.slots.used[n] || 0, "Niveau " + n, "", o["slots." + n].forced));
  }
  if (d.pact.count > 0 && d.pact.level > 0)
    rows.push(slotRow("pact", d.pact.level, d.pact.count, c.slots.pact, "Pacte", "niveau " + d.pact.level, o["pact.count"].forced || o["pact.level"].forced));
  const hasPact = d.pact.count > 0 && d.pact.level > 0;
  const slots = `
    <div class="sec-head"><h2>Emplacements</h2>

      : `<p class="hint">Aucun emplacement d'après les classes de ce personnage. « Ajuster » permet d'en ajouter (objet magique, don…).</p>`}`;

  let filters = "";
  if (c.spells.length){

    filters = `
      <label class="sr" for="spell-q">Rechercher un sort</label>

      <div class="chips" role="group" aria-label="Niveau">
        ${chip("lvl", "all", "Tous", f.lvl === "all")}
        ${levels.map(l => chip("lvl", l, l ? "Niv. " + l : "Tours de magie", f.lvl === String(l))).join("")}
      </div>
      <div class="chips" role="group" aria-label="Filtres">
        ${chip("prep", 1, "Préparés", f.prep)}${chip("conc", 1, "Concentration", f.conc)}${chip("rit", 1, "Rituel", f.rit)}
        ${chip("time", "action", "Action", f.time === "action")}${chip("time", "bonus", "Action bonus", f.time === "bonus")}${chip("time", "reaction", "Réaction", f.time === "reaction")}

    <div class="sec-head"><h2>Sorts</h2><button class="btn btn-primary" data-action="spell-add">Ajouter un sort</button></div>
    ${filters}

function renderSpellList(c){
  ensureSpellView();
  if (!c.spells.length) return `<p class="empty">Aucun sort pour l'instant. Touche « Ajouter un sort » et colle la description d'un sort : Miroir remplit la fiche pour toi.</p>`;
  const f = view.sf, q = norm(f.q);
  const list = c.spells.filter(s =>
    (f.lvl === "all" || s.level === +f.lvl) &&
    (!f.prep || s.level === 0 || s.prepared || s.always) &&
    (!f.conc || s.concentration) && (!f.rit || s.ritual) &&
    (f.time === "all" || s.time === f.time) &&
    (!f.school || s.school === f.school) &&
    (!q || norm(s.name).includes(q)));
  if (!list.length) return `<p class="empty">Aucun sort ne correspond à ces filtres.</p>
    <p style="text-align:center"><button class="btn" data-action="sf-reset">Retirer les filtres</button></p>`;
  const byName = (a, b) => (a.name || "").localeCompare(b.name || "", "fr");
  if (f.sort === "name") return `<ul class="spells">${list.sort(byName).map(s => spellItem(c, s)).join("")}</ul>`;
  let html = "";
  for (let l = 0; l <= 9; l++){
    const g = list.filter(s => s.level === l).sort(byName);
    if (!g.length) continue;
    html += `<h3 class="lvl-head">${l ? "Niveau " + l : "Tours de magie"}</h3><ul class="spells">${g.map(s => spellItem(c, s)).join("")}</ul>`;
  }
  return html;
}

function spellItem(c, s){
  const open = view.openSpells.has(s.id);
  const isConc = c.concentration && c.concentration.id === s.id;
  const name = esc(s.name) || "Sort sans nom";
  const pcls = s.always ? "on" : s.prepared ? "p1" : "";
  const ptxt = s.always ? "toujours préparé" : s.prepared ? "préparé" : "non préparé";
  const prep = s.level === 0 ? `<span class="prof" aria-hidden="true"></span>`
    : `<button class="prof" data-action="spell-prep" data-id="${s.id}" aria-label="${name} : ${ptxt}. Changer."><span class="pip ${pcls}" aria-hidden="true"></span></button>`;
  const marks = [], srm = [];
  if (s.time === "bonus"){ marks.push(`<span class="mark">Bonus</span>`); srm.push("action bonus"); }
  if (s.time === "reaction"){ marks.push(`<span class="mark">Réaction</span>`); srm.push("réaction"); }
  if (s.concentration){ marks.push(`<span class="mark c" title="Concentration">C</span>`); srm.push("concentration"); }
  if (s.ritual){ marks.push(`<span class="mark" title="Rituel">R</span>`); srm.push("rituel"); }
  if (isConc) srm.push("concentration en cours");
  let body = "";
  if (open){
    const facts = [["Incantation", s.castTime], ["Portée", s.range], ["Composantes", s.components], ["Durée", s.duration]]
      .filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    const up = s.higher ? paras(s.higher).replace("<p>", `<p><span class="up">${s.level ? "Aux niveaux supérieurs." : "Amélioration du sort mineur."}</span> `) : "";
    const cast = s.level > 0 ? `<button class="btn btn-primary" data-action="spell-cast" data-id="${s.id}">Lancer</button>`
      : (s.concentration && !isConc ? `<button class="btn btn-primary" data-action="spell-cast" data-id="${s.id}">Se concentrer</button>` : "");
    body = `<div class="spell-body">
      ${facts ? `<dl class="spell-facts">${facts}</dl>` : ""}
      <div class="spell-desc">${paras(s.description) || `<p class="hint">Pas de description.</p>`}${up}</div>
      <div class="spell-actions">
        ${cast}
        <button class="btn" data-action="spell-edit" data-id="${s.id}">Modifier</button>
        <button class="btn btn-quiet" data-action="spell-del" data-id="${s.id}">Supprimer</button>
      </div>
    </div>`;
  }
  return `<li class="spell${isConc ? " is-conc" : ""}">
    <div class="spell-row">
      ${prep}
      <button class="spell-open" data-action="spell-toggle" data-id="${s.id}" aria-expanded="${open}">
        <span class="spell-main"><span class="spell-name">${name}</span><span class="spell-meta">${esc(spellMeta(s))}${srm.length ? `<span class="sr">, ${srm.join(", ")}</span>` : ""}</span></span>
        <span class="marks" aria-hidden="true">${marks.join("")}</span>
      </button>
    </div>
    ${body}
  </li>`;
}

/* --- Analyseur copier-coller --- */
const FIELD_RE = [
  ["castTime", /^(?:temps d['’ ]?incantation|casting time)\s*:\s*(.*)$/i],
  ["range", /^(?:port[ée]e|range)\s*:\s*(.*)$/i],
  ["components", /^(?:composantes?|components?)\s*:\s*(.*)$/i],
  ["duration", /^(?:dur[ée]e|duration)\s*:\s*(.*)$/i]
];
const FIELD_SPLIT = ["temps d['’ ]?incantation", "casting time", "port[ée]e", "range", "composantes?", "components?", "dur[ée]e", "duration"];
const HIGHER_RE = /(?:^|\n|(?<=[.!?])[ ]+)[ ]*(?:aux niveaux sup[ée]rieurs|(?:utilisation d['’]un |avec un )?emplacement de (?:sort de )?niveau sup[ée]rieur|am[ée]lioration (?:de|du) sort mineur|at higher levels|using a higher[- ]level spell slot|cantrip upgrade)[ ]*[.:]?[ ]*/i;
const META_RE = /(?:niveau|level)\s*\d|\d\s*(?:er|e|eme|st|nd|rd|th)?[- ]?(?:niveau|level)|tour de magie|sort mineur|cantrip/;
const DUR_HEAD = /^(?:concentration,?\s*)?(?:(?:up to|jusqu['’]à)\s+)?(?:\d+\s+(?:rounds?|minutes?|heures?|hours?|jours?|days?)|1 tour|instantan\S*|until dispelled(?: or triggered)?|jusqu['’]à (?:ce qu'il soit |être )?(?:dissip|déclench)\S*(?: ou (?:dissip|déclench)\S*)?|sp[ée]ciale?|special|permanente?)/i;
const JUNK_RE = /^(?:classes?|disponible pour|sources?|listes? de sorts|spell lists?)\s*:/i;

function parseSpell(text){
  let t = String(text || "").replace(/\r/g, "").replace(/[\u00a0\u202f\t]/g, " ");
  // Champs collés sur une seule ligne : on les remet à la ligne
  for (const lbl of FIELD_SPLIT) t = t.replace(new RegExp("[ ]+(" + lbl + ")[ ]*:", "i"), "\n$1 :");
  const lines = t.split("\n").map(l => l.replace(/\s+/g, " ").trim());
  const out = {name:"", level:null, school:"", castTime:"", range:"", components:"", duration:"", ritual:false, description:"", higher:""};
  let first = -1, last = -1;
  for (let i = 0; i < lines.length; i++){
    for (const [k, re] of FIELD_RE){
      const mm = lines[i].match(re);
      if (!mm || out[k]) continue;
      let v = mm[1].trim(), at = i;
      if (!v){ // valeur sur la ligne suivante
        let j = i + 1; while (j < lines.length && !lines[j]) j++;
        if (j < lines.length && !FIELD_RE.some(([, r]) => r.test(lines[j]))){ v = lines[j]; at = j; }
      }
      if (k === "duration" && v.length > 50){ // texte collé d'un bloc : la description suit la durée
        const dm = v.match(DUR_HEAD);
        if (dm && v.slice(dm[0].length).trim()){ lines.splice(i + 1, 0, v.slice(dm[0].length).trim()); v = dm[0].trim(); }
      }
      out[k] = v; if (first < 0) first = i; last = Math.max(last, at);
      break;
    }
  }
  const nonEmpty = lines.map((l, i) => [l, i]).filter(([l]) => l);
  const head = first >= 0 ? nonEmpty.filter(([, i]) => i < first) : nonEmpty.slice(0, 2);
  let name = head.length ? head[0][0] : "";
  let metaTxt = "", metaEnd = head.length ? head[0][1] : -1;
  const isMeta = l => l.length < 90 && (META_RE.test(norm(l)) || SCHOOL_KEYS.some(([re]) => re.test(norm(l))));
  for (const [l, i] of head.slice(1)) if (isMeta(l)){ metaTxt += " " + norm(l); metaEnd = i; }
  if (!metaTxt && name){ // nom et niveau collés sur la même ligne
    const nn = norm(name);
    const idx = [nn.search(META_RE), ...SCHOOL_KEYS.map(([re]) => nn.search(re))].filter(x => x > 0);
    if (idx.length){ const mi = Math.min(...idx); metaTxt = nn.slice(mi); name = name.slice(0, mi).replace(/[\s,:;–—-]+$/, ""); }
  }
  out.name = name;
  const lm = metaTxt.match(/(?:niveau|level)\s*(\d)/) || metaTxt.match(/(\d)\s*(?:er|e|eme|st|nd|rd|th)?[- ]?(?:niveau|level)/);
  if (lm) out.level = +lm[1];
  else if (/tour de magie|sort mineur|cantrip/.test(metaTxt)) out.level = 0;
  const sk = SCHOOL_KEYS.find(([re]) => re.test(metaTxt));
  if (sk) out.school = sk[1];
  out.ritual = /rituel|ritual/.test(metaTxt + " " + norm(out.castTime));
  const start = last >= 0 ? last + 1 : metaEnd + 1;
  let desc = lines.slice(start).filter(l => !JUNK_RE.test(l)).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  const hm = desc.match(HIGHER_RE);
  if (hm){ out.higher = desc.slice(hm.index + hm[0].length).trim(); desc = desc.slice(0, hm.index).trim(); }
  out.description = desc;
  const missing = ["name", "level", "school", "castTime", "range", "components", "duration", "description"]
    .filter(k => out[k] === null || out[k] === "");
  const spell = normSpell(Object.assign({}, out, {
    id: uid(), level: out.level ?? 0, time: guessTime(out.castTime),
    concentration: /concentration/.test(norm(out.duration))
  }));
  return {spell, missing};
}

/* --- Feuilles liées aux sorts --- */
function sheetAddSpell(){
  if (!current()) return;
  openSheet(`

    <p class="hint">Miroir reconnaît le nom, le niveau, l'école, le temps d'incantation, la portée, les composantes, la durée et la description, en français comme en anglais. Tu vérifies tout avant d'enregistrer.</p>
    <div class="actions">
      <button class="btn" id="manual">Saisie manuelle</button>
      <button class="btn btn-primary" id="parse">Analyser le texte</button>
    </div>`, panel => {
    panel.querySelector("#manual").addEventListener("click", () => sheetSpellForm(normSpell({id: uid()}), {isNew:true}));
    panel.querySelector("#parse").addEventListener("click", () => {
      const txt = panel.querySelector("#paste").value.trim();
      if (!txt){ toast("Colle d'abord le texte d'un sort."); return; }

      sheetSpellForm(r.spell, {isNew:true, parsed:true, missing:r.missing});
    });
  });
}

function sheetSpellForm(s, opts){

  const dup = s.name && c.spells.some(x => x.id !== s.id && norm(x.name) === norm(s.name));
  const intro = opts.parsed ? (miss.size
      ? "Les champs encadrés n'ont pas été trouvés dans le texte : complète-les si besoin."
      : "Tout a été reconnu. Relis avant d'ajouter le sort.") : "";
  openSheet(`
    <h2>${opts.parsed ? "Vérifier le sort" : opts.isNew ? "Nouveau sort" : "Modifier le sort"}</h2>
    ${intro ? `<p class="hint">${intro}</p>` : ""}
    ${dup ? `<p class="hint" style="color:var(--blood-ink)">Un sort du même nom existe déjà sur cette fiche.</p>` : ""}
    <form id="f-spell">
      <label class="${fc("name")}"><span>Nom</span><input class="input" name="name" value="${esc(s.name)}" required autocomplete="off"></label>
      <div class="cols">
        <label class="${fc("level")}"><span>Niveau</span><select class="input" name="level">
          ${[...Array(10)].map((_, l) => `<option value="${l}" ${s.level === l ? "selected" : ""}>${l ? "Niveau " + l : "Tour de magie"}</option>`).join("")}
        </select></label>
        <label class="${fc("school")}"><span>École</span><select class="input" name="school">
          <option value="">—</option>${SCHOOLS.map(x => `<option ${s.school === x ? "selected" : ""}>${x}</option>`).join("")}
        </select></label>
      </div>
      <div class="cols">
        <label class="${fc("castTime")}"><span>Temps d'incantation</span><input class="input" name="castTime" value="${esc(s.castTime)}" autocomplete="off"></label>
        <label class="field"><span>Rangé en combat dans</span><select class="input" name="time">
          ${TIMES.map(([k, l]) => `<option value="${k}" ${s.time === k ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      </div>
      <div class="cols">
        <label class="${fc("range")}"><span>Portée</span><input class="input" name="range" value="${esc(s.range)}" autocomplete="off"></label>
        <label class="${fc("duration")}"><span>Durée</span><input class="input" name="duration" value="${esc(s.duration)}" autocomplete="off"></label>
      </div>
      <label class="${fc("components")}"><span>Composantes</span><input class="input" name="components" value="${esc(s.components)}" autocomplete="off"></label>
      <div class="cols">
        <label class="check"><input type="checkbox" name="concentration" ${s.concentration ? "checked" : ""}> Concentration</label>
        <label class="check"><input type="checkbox" name="ritual" ${s.ritual ? "checked" : ""}> Rituel</label>
        <label class="check"><input type="checkbox" name="prepared" ${s.prepared ? "checked" : ""}> Préparé</label>
        <label class="check"><input type="checkbox" name="always" ${s.always ? "checked" : ""}> Toujours préparé</label>
      </div>
      <label class="${fc("description")}"><span>Description</span><textarea class="input tall" name="description">${esc(s.description)}</textarea></label>
      <label class="field"><span>Aux niveaux supérieurs</span><textarea class="input" name="higher">${esc(s.higher)}</textarea></label>
      <div class="actions">
        <button type="button" class="btn" data-action="close">Annuler</button>
        <button type="submit" class="btn btn-primary">${opts.isNew ? "Ajouter le sort" : "Enregistrer"}</button>
      </div>
    </form>`, panel => {
    const form = panel.querySelector("form"), el = form.elements;
    el.castTime.addEventListener("input", () => { el.time.value = guessTime(el.castTime.value); });
    el.duration.addEventListener("input", () => { if (/concentration/.test(norm(el.duration.value))) el.concentration.checked = true; });
    form.addEventListener("submit", e => {
      e.preventDefault();
      const ns = normSpell({
        id: s.id, name: el.name.value, level: el.level.value, school: el.school.value,
        castTime: el.castTime.value, time: el.time.value, range: el.range.value, duration: el.duration.value,
        components: el.components.value, concentration: el.concentration.checked, ritual: el.ritual.checked,
        prepared: el.prepared.checked, always: el.always.checked,
        description: el.description.value, higher: el.higher.value
      });
      if (!ns.name){ toast("Donne un nom au sort."); return; }
      const i = c.spells.findIndex(x => x.id === ns.id);
      if (i >= 0) c.spells[i] = ns; else c.spells.push(ns);
      if (c.concentration && c.concentration.id === ns.id) c.concentration.name = ns.name;
      ensureSpellView(); view.openSpells.add(ns.id);
      touch(c); closeSheet(); render();
      toast(i >= 0 ? "Sort modifié." : ns.name + " ajouté à la fiche.");
    });
  });
}

function sheetCast(id){
  const c = current(); const s = c && c.spells.find(x => x.id === id); if (!s) return;
  if (s.level === 0){
    const br = startConc(c, s); touch(c); render();
    toast("Concentration sur " + s.name + "." + (br ? " " + br : "")); return;
  }
  const d = derive(c);
  const opt = (kind, lv, label, left, max) => `<button class="btn btn-block cast-opt" data-cast="${kind}" data-lv="${lv}" ${left ? "" : "disabled"}>
      <span>${label}</span><small>${left ? left + " sur " + max : "épuisé"}</small></button>`;
  const opts = [];
  for (let n = s.level; n <= 9; n++){
    const max = d.slots[n]; if (!max) continue;
    opts.push(opt("std", n, "Niveau " + n + (n > s.level ? " (supérieur)" : ""), max - clamp(c.slots.used[n] || 0, 0, max), max));
  }
  if (d.pact.count > 0 && d.pact.level >= s.level)
    opts.push(opt("pact", d.pact.level, "Pacte, niveau " + d.pact.level, d.pact.count - clamp(c.slots.pact, 0, d.pact.count), d.pact.count));
  if (s.ritual) opts.push(`<button class="btn btn-block cast-opt" data-cast="ritual"><span>En rituel</span><small>10 minutes de plus, sans emplacement</small></button>`);
  opts.push(`<button class="btn btn-block btn-quiet cast-opt" data-cast="free"><span>Sans emplacement</span><small>objet, don, capacité</small></button>`);
  const other = c.concentration && c.concentration.id !== s.id;
  openSheet(`
    <h2>Lancer ${esc(s.name) || "le sort"}</h2>
    ${s.concentration ? `<p class="hint">Sort de concentration.${other ? " Ta concentration sur " + esc(c.concentration.name) + " s'arrêtera." : ""}</p>` : ""}
    <p class="hint">Quel emplacement dépenses-tu ?</p>
    <div class="cast-opts">${opts.join("")}</div>
    <div class="actions"><button class="btn" data-action="close">Annuler</button></div>`, panel => {
    panel.querySelectorAll("[data-cast]").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.cast, nm = s.name || "Sort";
      let msg;
      if (k === "std"){
        const n = +b.dataset.lv, max = d.slots[n];
        c.slots.used[n] = clamp(c.slots.used[n] || 0, 0, max) + 1;
        const left = max - c.slots.used[n];
        msg = `${nm} : emplacement de niveau ${n} dépensé, ${left ? "il en reste " + left : "il n'en reste plus"}.`;
      } else if (k === "pact"){
        c.slots.pact = clamp(c.slots.pact, 0, d.pact.count) + 1;
        const left = d.pact.count - c.slots.pact;
        msg = `${nm} : emplacement de pacte dépensé, ${left ? "il en reste " + left : "il n'en reste plus"}.`;
      } else if (k === "ritual") msg = `${nm} : lancé en rituel, aucun emplacement dépensé.`;
      else msg = `${nm} : aucun emplacement dépensé.`;
      if (s.concentration){ const br = startConc(c, s); if (br) msg += " " + br; }
      touch(c); closeSheet(); render(); toast(msg);
    }));
  });
}
