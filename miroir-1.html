function sheetSlots(){
  const c = current(); if (!c) return;
  const d = derive(c), ci = d.ci;
  const keys = [1,2,3,4,5,6,7,8,9].map(n => "slots." + n).concat(["pact.count", "pact.level"]);
  const fld = (key, label) => { const o = d.out[key];
    return `<label class="field"><span>${label}${o.forced ? ' <span class="forced" aria-label="valeur forcée">†</span>' : ""}</span>
      <input class="input" type="number" inputmode="numeric" min="0" max="9" name="${key}" value="${o.value}">
      <small class="hint">calcul : ${o.calc}</small></label>`; };
  const origin = ci.parts.length
    ? "Niveau de lanceur de sorts " + ci.cl + " (" + ci.parts.map(([l, v]) => l + " compte pour " + v).join(", ") + ")."
    : "Aucune classe à emplacements reconnue.";
  const anyForced = keys.some(k => d.out[k].forced);
  openSheet(`
    <h2>Emplacements de sorts</h2>
    <p class="hint">${esc(origin)}${ci.wl ? " Magie de pacte : occultiste niveau " + ci.wl + "." : ""} Change un nombre pour le forcer (objet magique, don, homebrew).</p>
    <form id="f-slots">
      <div class="grid3">${[1,2,3,4,5,6,7,8,9].map(n => fld("slots." + n, "Niveau " + n)).join("")}</div>
      <hr class="divider">
      <div class="cols">${fld("pact.count", "Emplacements de pacte")}${fld("pact.level", "Niveau du pacte")}</div>
      <div class="actions">
        ${anyForced ? `<button type="button" class="btn" id="slots-reset">Revenir au calcul</button>` : `<button type="button" class="btn" data-action="close">Annuler</button>`}
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>`, panel => {
    const form = panel.querySelector("form");
    form.addEventListener("submit", e => {
      e.preventDefault();
      for (const k of keys){
        const n = parseInt(form.elements[k].value);
        if (Number.isNaN(n)) continue;
        const v = clamp(n, 0, 9);
        if (v === d.out[k].calc) delete c.overrides[k]; else c.overrides[k] = v;
      }
      touch(c); closeSheet(); render();
    });
    const r = panel.querySelector("#slots-reset");
    r && r.addEventListener("click", () => { keys.forEach(k => delete c.overrides[k]); touch(c); closeSheet(); render(); toast("Emplacements recalculés."); });
  });
}

function sheetLongRest(){
  const c = current(); if (!c) return;
  const cb = c.combat;
  const d = derive(c);
  const gets = ["tous tes points de vie"];
  if (d.slots.some(n => n > 0) || d.pact.count > 0) gets.push("tes emplacements de sorts");
  if (hitDicePool(c).some(p => p.used)) gets.push("tous tes dés de vie");
  if (cb.features.some(f => f.max && f.recharge !== "none")) gets.push("les utilisations de tes capacités");
  const also = [];
  if (c.exhaustion) also.push("ton épuisement baisse d'un niveau");
  if (cb.temp) also.push("tes PV temporaires disparaissent");
  if (c.concentration) also.push("ta concentration s'arrête");
  const alsoTxt = also.length ? " " + frList(also).replace(/^./, x => x.toUpperCase()) + "." : "";
  openSheet(`
    <h2>Repos long</h2>
    <p>Tu récupères ${frList(gets)}.${alsoTxt}</p>
    <div class="actions">
      <button class="btn" data-action="close">Annuler</button>
      <button class="btn btn-primary" id="lr">Terminer le repos long</button>
    </div>`, panel => {
    panel.querySelector("#lr").addEventListener("click", () => {
      c.slots.used = {}; c.slots.pact = 0; c.concentration = null;
      c.hitDice = {};
      cb.dmg = 0; cb.temp = 0; cb.death = {s:0, f:0}; cb.turn = {a:false, b:false, r:false};
      cb.features.forEach(f => { if (f.recharge !== "none") f.used = 0; });
      c.exhaustion = Math.max(0, c.exhaustion - 1);
      touch(c); closeSheet(); render(); toast("Repos long terminé.");
    });
  });
}

/* ================= Combat ================= */
function ensureCombatView(){ view.openCombat = view.openCombat || new Set(); }
function dmgTxt(dice, mod, type){ return dice + (mod ? sign(mod) : "") + (type ? " " + type : ""); }
function frList(a){ return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1]; }
function attacksPerAction(c){
  let n = 1;
  for (const k of c.classes){
    const x = norm(k.name);
    if (x === "guerrier") n = Math.max(n, k.level >= 20 ? 4 : k.level >= 11 ? 3 : k.level >= 5 ? 2 : 1);
    else if (["barbare","paladin","rodeur","moine"].includes(x) && k.level >= 5) n = Math.max(n, 2);
  }
  return n;
}
function weaponStats(c, d, w){
  const p = norm(w.props);
  let ab = w.ability;
  if (!AB_NAME[ab]) ab = /finesse/.test(p) ? (d.m.dex >= d.m.for ? "dex" : "for") : w.kind === "ranged" ? "dex" : "for";
  const pb = d.out.pb.value, exh = c.exhaustion * 2;
  const parts = [["Mod. " + AB_NAME[ab], d.m[ab]]];
  if (w.prof) parts.push(["maîtrise", pb]);
  if (w.magic) parts.push(["magie", w.magic]);
  if (w.atkMisc) parts.push(["autre bonus", w.atkMisc]);
  if (exh) parts.push(["épuisement", -exh]);
  const vm = w.props.match(/polyvalente\s*\(([^)]+)\)/i);
  const rm = w.props.match(/port[ée]e\s*([\d,.]+\s*\/\s*[\d,.]+)/i);
  let heavy = "";
  if (/lourde/.test(p)){
    const k = w.kind === "ranged" ? "dex" : "for";
    if (c.abilities[k] < 13) heavy = `Arme lourde : Désavantage aux jets d'attaque, ta ${AB_NAME[k]} est inférieure à 13.`;
  }
  return {ab, parts, atk: parts.reduce((s, x) => s + x[1], 0), dmg: d.m[ab] + w.magic + w.dmgMisc,
    mod: d.m[ab], dc: 8 + d.m[ab] + pb, versatile: vm ? vm[1].trim() : "",
    range: rm ? rm[1].replace(/\s/g, "") + " m" : "", heavy};
}

function renderCombat(c, d){
  ensureCombatView();
  const o = d.out, cb = c.combat, max = o["hp.max"].value, hp = curHp(c, d);
  const vitals = `<div class="vitals">
    ${derivedBtn(d, "ac", `<b>${o.ac.value}</b><small>Classe d'armure</small>`, "vital")}
    ${derivedBtn(d, "init", `<b>${sign(o.init.value)}</b><small>Initiative</small>`, "vital")}
    ${derivedBtn(d, "speed", `<b>${meters(o.speed.value)}</b><small>Vitesse</small>`, "vital")}
    ${d.ab ? derivedBtn(d, "spell.dc", `<b>${o["spell.dc"].value}</b><small>DD des sorts</small>`, "vital")
           : derivedBtn(d, "pb", `<b>${sign(o.pb.value)}</b><small>Maîtrise</small>`, "vital")}
  </div>`;
  const condNames = c.conditions.map(k => COND_BY[k].n);
  // Avec des états actifs, le bandeau en haut de la fiche sert d'accès.
  const condLine = condNames.length ? "" : `<button class="armor-line" data-action="conds">
    <span class="al-main"><small>États</small><b>Aucun</b></span>
    <span class="al-edit">Modifier</span></button>`;
  const arm = ARMOR[cb.armor];
  const armTxt = [arm ? arm.n + (cb.armorMagic ? " " + sign(cb.armorMagic) : "") : "Sans armure",
    cb.shield ? "bouclier" + (cb.shieldMagic ? " " + sign(cb.shieldMagic) : "") : ""].filter(Boolean).join(", ");
  const warns = [arm && arm.str && c.abilities.for < arm.str ? `Force ${arm.str} requise : vitesse réduite de 3 m` : "",
    arm && arm.st ? "Désavantage en Discrétion" : ""].filter(Boolean);
  const armorLine = `<button class="armor-line" data-action="armor">
    <span class="al-main"><small>Armure</small><b>${esc(armTxt)}</b>${warns.map(w => `<small class="warn">${w}.</small>`).join("")}</span>
    <span class="al-edit">Modifier</span></button>`;

  let death = "";
  if (hp === 0){
    const dead = cb.death.f >= 3, stable = cb.death.s >= 3;
    const pips = (k, n, lbl) => [0, 1, 2].map(i => `<button class="dpip ${k}${i < n ? " on" : ""}" data-action="death" data-k="${k}" data-i="${i}" aria-label="${lbl} ${i + 1} sur 3${i < n ? ", cochée" : ""}. Changer."><i></i></button>`).join("");
    death = `<div class="death">
      <p class="death-state">${dead ? "Le personnage est mort." : stable ? "Stable : inconscient, hors de danger." : "Inconscient, à 0 point de vie."}</p>
      <div class="death-row"><span>Réussites</span><span class="dpips">${pips("s", cb.death.s, "Réussite")}</span></div>
      <div class="death-row"><span>Échecs</span><span class="dpips">${pips("f", cb.death.f, "Échec")}</span></div>
      ${dead || stable ? "" : `<p class="hint">Au début de chacun de tes tours, lance un d20 : 10 ou plus est une réussite. Un 1 compte pour deux échecs, un 20 te rend 1 point de vie.</p>
      <button class="btn" data-action="death-20">20 naturel : reprendre 1 PV</button>`}
    </div>`;
  }
  const low = hp > 0 && hp <= max / 4;
  const hpCard = `<section class="hp-card${low ? " low" : ""}" aria-label="Points de vie">
    <div class="hp-line"><span class="hp-lbl">Points de vie</span>${cb.temp ? `<span class="hp-temp">+${cb.temp} temporaires</span>` : ""}</div>
    <div class="hp-nums"><b class="hp-cur" aria-label="${hp} points de vie actuels">${hp}</b><span class="hp-sep" aria-hidden="true">/</span>
      ${derivedBtn(d, "hp.max", String(max), "hp-max")}</div>
    ${death || `<div class="hp-bar" aria-hidden="true"><i style="width:${max ? Math.round(hp / max * 100) : 0}%"></i></div>`}
    <div class="hp-btns">
      <button class="btn btn-primary" data-action="hp" data-mode="dmg">Dégâts</button>
      <button class="btn" data-action="hp" data-mode="heal">Soins</button>
      <button class="btn" data-action="hp" data-mode="temp">PV temp.</button>
    </div>
  </section>`;

  const tog = (k, label) => `<button class="turn-tog" data-action="turn" data-k="${k}" aria-pressed="${cb.turn[k]}" aria-label="${label} ${cb.turn[k] ? "utilisée" : "disponible"}. Changer.">
    <span class="pip ${cb.turn[k] ? "on" : ""}" aria-hidden="true"></span>${cb.turn[k] ? "Utilisée" : "Disponible"}</button>`;
  const anyTurn = cb.turn.a || cb.turn.b || cb.turn.r;
  const turnBar = `<div class="turn-bar"><span class="hint">Coche ce que tu as dépensé pendant ton tour.</span>
    <button class="btn" data-action="turn-new" ${anyTurn ? "" : "disabled"}>Nouveau tour</button></div>`;

  const byName = (a, b) => (a.name || "").localeCompare(b.name || "", "fr");
  const sp = t => c.spells.filter(s => s.time === t && (s.level === 0 || s.prepared || s.always))
    .sort((a, b) => a.level - b.level || byName(a, b)).map(s => combatSpellItem(c, s));
  const ft = t => cb.features.filter(f => f.time === t).map(featItem);
  const list = items => items.length ? `<ul class="spells cb-list">${items.join("")}</ul>` : "";
  const grp = (title, items) => items.length ? `<h3 class="lvl-head">${title}</h3>${list(items)}` : "";

  const napa = attacksPerAction(c);
  const attacks = [...cb.weapons.map(w => weaponItem(c, d, w)), unarmedItem(c, d)];
  const action = `
    <div class="sec-head"><h2>Action</h2>${tog("a", "Action")}</div>
    ${grp("Attaques" + (napa > 1 ? `<small>${napa} par action Attaque</small>` : ""), attacks)}
    <button class="btn btn-quiet add-line" data-action="wpn-add">+ Ajouter une arme</button>
    ${grp("Sorts", sp("action"))}${grp("Capacités", ft("action"))}`;
  const bs = sp("bonus"), bf = ft("bonus");
  const bonus = `
    <div class="sec-head"><h2>Action bonus</h2>${tog("b", "Action bonus")}</div>
    ${bs.length || bf.length ? grp("Sorts", bs) + grp("Capacités", bf)
      : `<p class="hint">Rien pour l'instant. Les sorts préparés à incanter en action bonus et les capacités rangées ici (Rage, Ruse, Second souffle…) apparaîtront dans cette section.</p>`}`;
  const oa = `<li class="spell"><div class="spell-row"><div class="spell-open"><span class="spell-main">
    <span class="spell-name">Attaque d'opportunité</span>
    <span class="spell-meta">Une attaque au corps à corps quand une créature que tu vois sort de ton allonge.</span></span></div></div></li>`;
  const reaction = `
    <div class="sec-head"><h2>Réaction</h2>${tog("r", "Réaction")}</div>
    ${list([oa])}${grp("Sorts", sp("reaction"))}${grp("Capacités", ft("reaction"))}`;
  const other = ft("other");
  const caps = `
    <div class="sec-head"><h2>Autres capacités</h2><button class="btn btn-primary" data-action="feat-add">Ajouter une capacité</button></div>
    ${other.length ? list(other) : `<p class="hint">Traits d'espèce, capacités de classe, dons… Range une capacité en action, action bonus ou réaction pour la retrouver plus haut, ou en « Autre » pour la garder ici. Ses utilisations se rechargent au repos.</p>`}`;
  const rest = `<div class="sec-head"><h2>Repos</h2></div>
    <ul class="slots hd-rows">${hitDicePool(c).map(hdRow).join("")}</ul>
    <p class="hint">Au repos court, dépense tes dés de vie pour récupérer des PV. Le repos long les rend tous.</p>
    <div class="rest-btns"><button class="btn" data-action="rest-short">Repos court</button><button class="btn" data-action="rest-long">Repos long</button></div>`;
  return vitals + armorLine + condLine + hpCard + turnBar + action + bonus + reaction + caps + rest;
}

function weaponItem(c, d, w){
  const st = weaponStats(c, d, w), key = "w:" + w.id, open = view.openCombat.has(key);
  const name = esc(w.name) || "Arme sans nom";
  const dmg = dmgTxt(w.dice, st.dmg, w.dtype);
  const meta = [dmg, st.range, w.masteryOn ? w.mastery : ""].filter(Boolean).join(", ");
  let body = "";
  if (open){
    const facts = [
      ["Attaque", st.parts.map(([l, v]) => l + " " + sign(v)).join(", ")],
      ["Dégâts", dmg + (st.versatile ? ", ou " + dmgTxt(st.versatile, st.dmg, w.dtype) + " à deux mains" : "")],
      ["Propriétés", w.props],
      ["Botte", w.mastery ? w.mastery + (w.masteryOn ? "" : " (tu ne peux pas l'utiliser)") : ""]
    ].filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    const mt = w.masteryOn && MASTERY[w.mastery] ? `<p><span class="up">${esc(w.mastery)}.</span> ${esc(MASTERY[w.mastery](st))}</p>` : "";
    body = `<div class="spell-body">
      <dl class="spell-facts">${facts}</dl>
      <div class="spell-desc">${mt}${st.heavy ? `<p class="warn">${esc(st.heavy)}</p>` : ""}${paras(w.notes)}</div>
      <div class="spell-actions">
        <button class="btn" data-action="wpn-edit" data-id="${w.id}">Modifier</button>
        <button class="btn btn-quiet" data-action="wpn-del" data-id="${w.id}">Supprimer</button>
      </div></div>`;
  }
  return `<li class="spell"><div class="spell-row">
    <button class="spell-open" data-action="cb-toggle" data-key="${key}" aria-expanded="${open}" aria-label="${name}, attaque ${sign(st.atk)}, ${esc(meta)}">
      <span class="atk-bonus" aria-hidden="true">${sign(st.atk)}<small>attaque</small></span>
      <span class="spell-main" aria-hidden="true"><span class="spell-name">${name}</span><span class="spell-meta">${esc(meta)}</span></span>
    </button></div>${body}</li>`;
}

function unarmedItem(c, d){
  const monk = c.classes.find(k => norm(k.name) === "moine");
  const exh = c.exhaustion * 2, pb = d.out.pb.value;
  let ab = "for", dmg;
  if (monk){
    ab = d.m.dex > d.m.for ? "dex" : "for";
    const die = monk.level >= 17 ? "1d12" : monk.level >= 11 ? "1d10" : monk.level >= 5 ? "1d8" : "1d6";
    dmg = dmgTxt(die, d.m[ab], "contondants") + ", arts martiaux";
  } else {
    const v = Math.max(0, 1 + d.m.for);
    dmg = v + (v > 1 ? " contondants" : " contondant");
  }
  const atk = d.m[ab] + pb - exh;
  return `<li class="spell"><div class="spell-row"><div class="spell-open" aria-label="Mains nues, attaque ${sign(atk)}, ${esc(dmg)}">
    <span class="atk-bonus" aria-hidden="true">${sign(atk)}<small>attaque</small></span>
    <span class="spell-main" aria-hidden="true"><span class="spell-name">Mains nues</span><span class="spell-meta">${esc(dmg)}</span></span>
  </div></div></li>`;
}

function combatSpellItem(c, s){
  const isConc = c.concentration && c.concentration.id === s.id;
  const name = esc(s.name) || "Sort sans nom";
  const meta = [s.level ? "Niveau " + s.level : "Tour de magie", s.range].filter(Boolean).join(", ");
  const canCast = s.level > 0 || (s.concentration && !isConc);
  return `<li class="spell${isConc ? " is-conc" : ""}"><div class="spell-row">
    <button class="spell-open" data-action="cspell-view" data-id="${s.id}">
      <span class="spell-main"><span class="spell-name">${name}</span><span class="spell-meta">${esc(meta)}${s.concentration ? `<span class="sr">, concentration${isConc ? " en cours" : ""}</span>` : ""}</span></span>
      ${s.concentration ? `<span class="marks" aria-hidden="true"><span class="mark c">C</span></span>` : ""}
    </button>
    ${canCast ? `<button class="btn cast-btn" data-action="spell-cast" data-id="${s.id}" aria-label="${s.level ? "Lancer" : "Se concentrer sur"} ${name}">${s.level ? "Lancer" : "Se concentrer"}</button>` : ""}
  </div></li>`;
}

function featItem(f){
  const key = "f:" + f.id, open = view.openCombat.has(key);
  const name = esc(f.name) || "Capacité sans nom";
  const left = f.max - f.used;
  const meta = f.max ? `${left} sur ${f.max}, ${RECHARGE[f.recharge].toLowerCase()}` : "";
  let pips = "";
  if (f.max && f.max <= 10){
    for (let i = 0; i < f.max; i++){
      const av = i < left;
      pips += `<button class="slot-pip${av ? "" : " spent"}" data-action="feat-use" data-id="${f.id}" data-spend="${av ? 1 : -1}" aria-label="${name} : utilisation ${av ? "disponible. La dépenser." : "dépensée. La récupérer."}"><i></i></button>`;
    }
  } else if (f.max){
    pips = `<button class="btn btn-quiet" data-action="feat-use" data-id="${f.id}" data-spend="1" aria-label="Dépenser une utilisation de ${name}" ${left ? "" : "disabled"}>−</button>
      <span class="feat-count">${left}/${f.max}</span>
      <button class="btn btn-quiet" data-action="feat-use" data-id="${f.id}" data-spend="-1" aria-label="Récupérer une utilisation de ${name}" ${f.used ? "" : "disabled"}>+</button>`;
  }
  const body = open ? `<div class="spell-body">
      <div class="spell-desc">${paras(f.desc) || `<p class="hint">Pas de description.</p>`}</div>
      <div class="spell-actions">
        <button class="btn" data-action="feat-edit" data-id="${f.id}">Modifier</button>
        <button class="btn btn-quiet" data-action="feat-del" data-id="${f.id}">Supprimer</button>
      </div></div>` : "";
  return `<li class="spell"><div class="spell-row">
    <button class="spell-open" data-action="cb-toggle" data-key="${key}" aria-expanded="${open}">
      <span class="spell-main"><span class="spell-name">${name}</span>${meta ? `<span class="spell-meta">${esc(meta)}</span>` : ""}</span>
    </button></div>
    ${pips ? `<div class="feat-pips">${pips}</div>` : ""}${body}</li>`;
}

/* --- Points de vie --- */
function applyHP(c, k, n){
  const d = derive(c), cb = c.combat, max = d.out["hp.max"].value;
  const hp = curHp(c, d), msgs = [];
  if (k === "temp"){
    if (n > cb.temp){ cb.temp = n; return n + " points de vie temporaires."; }
    return `Tu gardes tes ${cb.temp} PV temporaires : ils ne se cumulent pas.`;
  }
  if (!n) return "";
  if (k === "heal"){
    const now = Math.min(max, hp + n);
    cb.dmg = max - now;
    if (hp === 0){ cb.death = {s:0, f:0}; msgs.push("Tu reprends conscience."); }
    msgs.push(`${now - hp} PV récupérés, ${now} sur ${max}.`);
    return msgs.join(" ");
  }
  let rest = n;
  const absorbed = Math.min(cb.temp, rest);
  cb.temp -= absorbed; rest -= absorbed;
  if (absorbed) msgs.push(`${absorbed} absorbés par les PV temporaires.`);
  if (hp === 0){
    if (rest >= max){ cb.death.f = 3; msgs.push("Dégâts massifs : mort instantanée."); }
    else if (rest > 0){
      cb.death.f = Math.min(3, cb.death.f + 1); cb.death.s = Math.min(cb.death.s, 2);
      msgs.push("Dégâts à 0 PV : un échec au jet contre la mort, deux sur un coup critique.");
    }
  } else if (rest > 0){
    const left = hp - rest;
    if (left <= 0){
      cb.dmg = max;
      if (-left >= max){ cb.death = {s:0, f:3}; msgs.push("Dégâts massifs : mort instantanée."); }
      else { cb.death = {s:0, f:0}; msgs.push("0 PV : tu tombes inconscient."); }
    } else { cb.dmg = max - left; msgs.push(`${rest} dégâts, il te reste ${left} PV.`); }
  }
  if (c.concentration){
    if (curHp(c, d) === 0){ msgs.push(`Concentration sur ${c.concentration.name} rompue.`); c.concentration = null; }
    else msgs.push(`Concentration : jet de Constitution DD ${clamp(Math.floor(n / 2), 10, 30)}.`);
  }
  return msgs.join(" ");
}

function sheetHP(mode){
  const c = current(); if (!c) return;
  const d = derive(c), cb = c.combat, max = d.out["hp.max"].value, hp = curHp(c, d);
  const T = {dmg:"Dégâts subis", heal:"Soins reçus", temp:"Points de vie temporaires"};
  const B = {dmg:"Dégâts", heal:"Soins", temp:"PV temp."};
  openSheet(`
    <h2>${T[mode]}</h2>
    <p class="hint">Tu as ${hp} PV sur ${max}${cb.temp ? ", plus " + cb.temp + " temporaires" : ""}.</p>
    <form id="f-hp">
      <input class="input big-input" name="n" type="number" inputmode="numeric" min="0" aria-label="${T[mode]}" autofocus>
      <div class="actions">${["dmg", "heal", "temp"].map(k => `<button type="${k === mode ? "submit" : "button"}" class="btn${k === mode ? " btn-primary" : ""}" data-hp="${k}">${B[k]}</button>`).join("")}</div>
    </form>
    <p class="hint">Les dégâts entament d'abord les PV temporaires. Ceux-ci ne se cumulent pas : tu gardes le total le plus haut.</p>`, panel => {
    const form = panel.querySelector("form"), inp = form.elements.n;
    const go = k => {
      const n = parseInt(inp.value);
      if (Number.isNaN(n) || n < 0){ toast("Entre un nombre."); inp.focus(); return; }
      const msg = applyHP(c, k, n);
      touch(c); closeSheet(); render(); msg && toast(msg);
    };
    form.addEventListener("submit", e => { e.preventDefault(); go(mode); });
    panel.querySelectorAll('button[type="button"][data-hp]').forEach(b => b.addEventListener("click", () => go(b.dataset.hp)));
  });
}

/* --- Armure --- */
function sheetArmor(){
  const c = current(); if (!c) return;
  const cb = c.combat;
  const opt = (cat, suffix) => Object.entries(ARMOR).filter(([, a]) => a.cat === cat)
    .map(([k, a]) => `<option value="${k}" ${cb.armor === k ? "selected" : ""}>${a.n} (${a.ac}${suffix})</option>`).join("");
  const num = (name, label, v, min, max) => `<label class="field"><span>${label}</span><input class="input" name="${name}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${v}"></label>`;
  openSheet(`
    <h2>Armure et bouclier</h2>
    <form id="f-arm">
      <label class="field"><span>Armure portée</span><select class="input" name="armor">
        <option value="none">Aucune</option>
        <optgroup label="Armures légères">${opt("L", " + Dex")}</optgroup>
        <optgroup label="Armures intermédiaires">${opt("I", " + Dex, max 2")}</optgroup>
        <optgroup label="Armures lourdes">${opt("H", "")}</optgroup>
      </select></label>
      <div class="cols">${num("armorMagic", "Bonus magique de l'armure", cb.armorMagic, -5, 5)}${num("shieldMagic", "Bonus magique du bouclier", cb.shieldMagic, -5, 5)}</div>
      <label class="check"><input type="checkbox" name="shield" ${cb.shield ? "checked" : ""}> Bouclier (+2)</label>
      ${num("acMisc", "Autres bonus à la CA", cb.acMisc, -10, 10)}
      <p class="hint">Style de combat Défense, anneau de protection… Sans armure, Miroir applique la Défense sans armure du barbare ou du moine. Pour un sort comme Armure du mage, force la CA en touchant sa valeur.</p>
      <div class="actions">
        <button type="button" class="btn" data-action="close">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>`, panel => {
    const form = panel.querySelector("form"), el = form.elements;
    form.addEventListener("submit", e => {
      e.preventDefault();

/* --- Repos --- */
function shortRest(c, healed){
  const msgs = [];
  if (healed) msgs.push(healed + " PV récupérés");
  if (c.slots.pact){ c.slots.pact = 0; msgs.push("emplacements de pacte récupérés"); }
  const n = c.combat.features.filter(f => f.recharge === "short" && f.used).length;
  c.combat.features.forEach(f => { if (f.recharge === "short") f.used = 0; });
  if (n) msgs.push(n > 1 ? n + " capacités rechargées" : "1 capacité rechargée");
  return "Repos court terminé" + (msgs.length ? " : " + frList(msgs) + "." : ".");
}

/* ================= États ================= */
function condBand(c){
  if (!c.conditions.length) return "";
  const names = frList(c.conditions.map(k => COND_BY[k].n));
  return `<button class="cond-band" data-action="conds" aria-label="${c.conditions.length > 1 ? "États" : "État"} : ${esc(names)}. Modifier.">
    <small>${c.conditions.length > 1 ? "États" : "État"}</small><b>${esc(names)}</b></button>`;
}
function setCondition(c, k, on){
  const set = new Set(c.conditions);
  if (on) set.add(k); else set.delete(k);
  c.conditions = CONDITIONS.map(x => x.k).filter(x => set.has(x));
  if (on && COND_BY[k].inc && c.concentration){
    const n = c.concentration.name; c.concentration = null;
    return `${COND_BY[k].n} : concentration sur ${n} rompue.`;
  }
  return "";
}
function sheetConds(){
  const c = current(); if (!c) return;
  openSheet(`
    <h2 tabindex="-1" autofocus>États</h2>
    <p class="hint">Coche ce qui affecte ton personnage. Les états restent affichés en haut de la fiche jusqu'à ce que tu les décoches. Agrippé, Entravé et les états qui immobilisent mettent ta vitesse à 0.</p>
    <ul class="cond-list">${CONDITIONS.map(x => `<li><label class="cond">
      <input type="checkbox" data-k="${x.k}" ${c.conditions.includes(x.k) ? "checked" : ""}>
      <span><b>${x.n}</b><small>${x.t}</small></span></label></li>`).join("")}</ul>
    <div class="actions">
      <button class="btn" id="cd-clear" ${c.conditions.length ? "" : "disabled"}>Tout décocher</button>
      <button class="btn btn-primary" data-action="close">Fermer</button>
    </div>`, panel => {
    const clear = panel.querySelector("#cd-clear");
    panel.addEventListener("change", e => {
      const k = e.target.dataset.k; if (!k) return;
      const msg = setCondition(c, k, e.target.checked);
      clear.disabled = !c.conditions.length;
      touch(c); render(); msg && toast(msg);
    });
    clear.addEventListener("click", () => {
      c.conditions = []; panel.querySelectorAll("input[data-k]").forEach(i => { i.checked = false; });
      clear.disabled = true; touch(c); render(); toast("Plus aucun état.");
    });
  });
}

/* ================= Dés de vie ================= */
function hdRow(p){
  const left = p.total - p.used;
  let pips = "";
  if (p.total <= 10){
    for (let i = 0; i < p.total; i++){
      const av = i < left;
      pips += `<button class="slot-pip${av ? "" : " spent"}" data-action="hd" data-z="${p.z}" data-d="${av ? 1 : -1}" aria-label="Dé de vie d${p.z} ${av ? "disponible. Le dépenser." : "dépensé. Le récupérer."}"><i></i></button>`;
    }
  } else {
    pips = `<span class="feat-pips" style="margin:0">
      <button class="btn btn-quiet" data-action="hd" data-z="${p.z}" data-d="1" aria-label="Dépenser un d${p.z}" ${left ? "" : "disabled"}>−</button>
      <span class="feat-count">${left}/${p.total}</span>
      <button class="btn btn-quiet" data-action="hd" data-z="${p.z}" data-d="-1" aria-label="Récupérer un d${p.z}" ${p.used ? "" : "disabled"}>+</button></span>`;
  }
  return `<li class="slot-row">
    <span class="slot-lv"><span>d${p.z}</span><small>dés de vie</small></span>
    <span class="slot-pips">${pips}</span>
    ${p.total <= 10 ? `<span class="slot-count" aria-hidden="true">${left}/${p.total}</span>` : ""}
  </li>`;
}

function sheetShortRest(){
  const c = current(); if (!c) return;
  const log = []; let healed = 0;
  const draw = panel => {
    const d = derive(c), max = d.out["hp.max"].value, hp = curHp(c, d), con = d.m.con;
    const pool = hitDicePool(c);
    const also = [];
    if (c.slots.pact) also.push("tes emplacements de pacte");
    if (c.combat.features.some(f => f.recharge === "short" && f.used)) also.push("tes capacités de repos court");
    panel.innerHTML = `
      <h2 tabindex="-1" autofocus>Repos court</h2>
      <p>Chaque dé de vie dépensé te rend son résultat ${sign(con)} (Constitution) en points de vie, au moins 1.</p>
      <p class="sr-hp" aria-live="polite"><b>${hp}</b><span>sur ${max} PV</span></p>
      <label class="field"><span>Tu lances tes propres dés ? Tape le résultat. Sinon, laisse vide et Miroir lance pour toi.</span>
        <input class="input" id="sr-roll" type="number" inputmode="numeric" min="1" max="12" placeholder="Résultat du dé"></label>
      <div class="cast-opts">${pool.map(p => {
        const left = p.total - p.used;
        return `<button class="btn cast-opt" data-z="${p.z}" ${left && hp < max ? "" : "disabled"}>Dépenser un d${p.z}<small>${left} sur ${p.total}</small></button>`;
      }).join("")}</div>
      ${hp >= max ? `<p class="hint" style="margin-top:.6rem">Tu as tous tes points de vie.</p>` : ""}
      ${log.length ? `<ul class="breakdown sr-log">${log.map(l => `<li><span>${l[0]}</span><span>+${l[1]} PV</span></li>`).join("")}</ul>` : ""}
      ${also.length ? `<p class="hint" style="margin-top:1rem">En terminant, tu récupères aussi ${frList(also)}.</p>` : ""}
      <div class="actions">
        <button class="btn" data-action="close">Fermer</button>
        <button class="btn btn-primary" id="sr-end">Terminer le repos court</button>
      </div>`;
    panel.querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", () => {
      const z = +b.dataset.z, p = hitDicePool(c).find(x => x.z === z);
      if (!p || p.used >= p.total) return;
      const raw = panel.querySelector("#sr-roll").value.trim();
      let roll;
      if (raw){
        roll = parseInt(raw);
        if (!(roll >= 1 && roll <= z)){ toast(`Un d${z} donne un résultat de 1 à ${z}.`); return; }
      } else roll = 1 + Math.floor(Math.random() * z);
      const dd = derive(c), before = curHp(c, dd), mx = dd.out["hp.max"].value;
      const gain = Math.max(1, roll + dd.m.con);
      c.hitDice[z] = p.used + 1;
      if (before === 0) c.combat.death = {s:0, f:0};
      c.combat.dmg = mx - Math.min(mx, before + gain);
      const got = Math.min(mx, before + gain) - before;
      healed += got;
      log.push([`d${z} : ${roll} ${dd.m.con < 0 ? "−" : "+"} ${Math.abs(dd.m.con)}${raw ? "" : " (lancé par Miroir)"}`, got]);
      touch(c); render(); draw(panel);
    }));
    panel.querySelector("#sr-end").addEventListener("click", () => {
      const msg = shortRest(c, healed); touch(c); closeSheet(); render(); toast(msg);
    });
  };
  openSheet("", draw);
}

/* ================= Sac ================= */
const kg = n => n.toLocaleString("fr-FR", {maximumFractionDigits:2}) + " kg";
function carry(c){
  const gol = norm(c.species) === "goliath";
  const cap = c.abilities.for * 7.5 * (gol ? 2 : 1);
  const coins = COINS.reduce((s, [k]) => s + c.money[k], 0);
  const items = c.inventory.reduce((s, i) => s + i.qty * i.weight, 0);
  return {cap, gol, total: Math.round((items + coins / 100) * 100) / 100,
    att: c.inventory.filter(i => i.attuned).length};
}
function renderBag(c){
  view.openItems = view.openItems || new Set();
  const w = carry(c);
  const wealth = COINS.reduce((s, [k]) => s + c.money[k] * COIN_PO[k], 0);
  const coins = `<div class="coins">${COINS.map(([k, n]) => `<button class="coin ${k}" data-action="coin" data-k="${k}" aria-label="${n} : ${c.money[k]}. Modifier.">
    <b>${c.money[k].toLocaleString("fr-FR")}</b><small>${k}</small></button>`).join("")}</div>`;
  const pct = w.cap ? Math.min(100, Math.round(w.total / w.cap * 100)) : 100;
  const over = w.total > w.cap;
  const att = w.att ? `<p class="${w.att > 3 ? "warn" : "hint"}">Harmonisation : ${w.att} objet${w.att > 1 ? "s" : ""} sur 3${w.att > 3 ? ", c'est plus que le maximum" : ""}.</p>` : "";
  const items = c.inventory.map(itemRow).join("");
  return `
    <div class="sec-head"><h2>Bourse</h2>${wealth ? `<span class="wealth">${wealth.toLocaleString("fr-FR", {maximumFractionDigits:2})} po en tout</span>` : ""}</div>
    ${coins}
    <div class="sec-head"><h2>Objets</h2><button class="btn btn-primary" data-action="item-add">Ajouter un objet</button></div>
    ${c.inventory.length ? `<ul class="spells">${items}</ul>`
      : `<p class="hint">Ton sac est vide. Ajoute ton équipement : rations, corde, potions… Le poids est facultatif. Armes et armure se gèrent dans l'onglet Combat.</p>`}
    ${att}
    <div class="load${over ? " over" : ""}">
      <div class="load-line"><b>Charge : ${kg(w.total)}</b><span>sur ${kg(w.cap)}</span></div>
      <div class="hp-bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      ${over ? `<p class="warn">Charge dépassée : au-delà de ta capacité, tu peux seulement traîner, pousser ou soulever (jusqu'au double), à 1,5 m de vitesse.</p>` : ""}
      <p class="hint">Capacité : Force ${c.abilities.for} × 7,5 kg${w.gol ? ", doublée par la Carrure puissante du goliath" : ""}. Les pièces comptent, 500 g les 50.</p>
    </div>`;
}

      if (g && !el.weight.value) el.weight.value = String(g[1]).replace(".", ",");
    });
    form.addEventListener("submit", e => {
      e.preventDefault();
      const ni = normItem({id: it.id, name: el.name.value, qty: el.qty.value === "" ? 1 : el.qty.value,
        weight: el.weight.value, attuned: el.attuned.checked, notes: el.notes.value});
      if (!ni.name){ toast("Donne un nom à l'objet."); return; }
      if (ni.attuned && !it.attuned && others >= 3){ toast("Tu es déjà harmonisé avec 3 objets. Retire une harmonisation d'abord."); return; }
      const i = c.inventory.findIndex(x => x.id === ni.id);
      if (i >= 0) c.inventory[i] = ni; else c.inventory.push(ni);
      touch(c); closeSheet(); render();
      toast(i >= 0 ? "Objet modifié." : ni.name + " ajouté au sac.");
    });
  });
}
function sheetCoin(k){
  const c = current(); if (!c) return;
  const name = (COINS.find(x => x[0] === k) || [k, k])[1];
  openSheet(`
    <h2>${name}</h2>
    <p class="hint">Tu en as ${c.money[k].toLocaleString("fr-FR")}.</p>
    <form id="f-coin">
      <input class="input big-input" name="n" type="number" inputmode="numeric" min="0" aria-label="Nombre de pièces" autofocus>
      <div class="actions">
        <button type="button" class="btn" data-m="sub">Retirer</button>
        <button type="submit" class="btn btn-primary">Ajouter</button>
      </div>
      <button type="button" class="btn btn-quiet btn-block" data-m="set" style="margin-top:.5rem">Remplacer le total par ce nombre</button>
    </form>`, panel => {
    const input = panel.querySelector("input");
    const apply = mode => {
      const n = parseInt(input.value);
      if (!(n >= 0)){ toast("Entre un nombre de pièces."); return; }
      const have = c.money[k];
      if (mode === "sub" && n > have){ toast(`Tu n'as que ${have} ${k}.`); return; }
      c.money[k] = clamp(mode === "add" ? have + n : mode === "sub" ? have - n : n, 0, 9999999);
      touch(c); closeSheet(); render();
      toast(mode === "set" ? `${c.money[k]} ${k}.` : `${mode === "add" ? "+" : "−"}${n} ${k}, tu en as ${c.money[k]}.`);
    };
    panel.querySelector("form").addEventListener("submit", e => { e.preventDefault(); apply("add"); });
    panel.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => apply(b.dataset.m)));
  });
}

/* ================= Sauvegarde et installation ================= */
function markExported(){ try { localStorage.setItem(EXPORT_KEY, String(Date.now())); } catch(e){} }
function backupNote(){
  if (!chars.length) return "";
  let last = 0; try { last = +localStorage.getItem(EXPORT_KEY) || 0; } catch(e){}
  const days = Math.floor((Date.now() - last) / 864e5);
  if (last && days < 14) return "";
  return `<p class="backup-note">${last ? `Dernière sauvegarde il y a ${days} jours.` : "Tes fiches n'ont jamais été sauvegardées."}
    Le navigateur peut effacer ses données sans prévenir : utilise « Tout exporter » de temps en temps et garde le fichier.</p>`;
}
function sheetInstall(){
  openSheet(`<div class="install">
    <h2 tabindex="-1" autofocus>Miroir sur l'écran d'accueil</h2>
    <p>Une icône sur ton téléphone ouvre Miroir directement, comme une application.</p>
    <h3>iPhone et iPad</h3>
    <p>Dans Safari, touche le bouton Partager (le carré avec une flèche), puis « Sur l'écran d'accueil ».</p>
    <h3>Android</h3>
    <p>Dans Chrome, ouvre le menu ⋮, puis « Ajouter à l'écran d'accueil ».</p>
    <p class="hint">Sur certains téléphones, l'icône garde ses propres données, séparées de celles du navigateur. Si tes fiches n'y apparaissent pas, exporte-les depuis le navigateur puis importe le fichier depuis l'icône.</p>
    <div class="actions"><button class="btn btn-primary" data-action="close">Compris</button></div>
  </div>`);
}

/* ================= Export / import ================= */
const capP = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);

function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "personnage"; }

function sheetExport(list, filename){
  const json = JSON.stringify({miroir:SCHEMA, exportedAt:new Date().toISOString(), characters:list}, null, 2);
  openSheet(`
    <h2>Exporter ${list.length > 1 ? list.length + " personnages" : "la fiche"}</h2>
    <p>Garde ce fichier en lieu sûr : il permet de restaurer ${list.length > 1 ? "les fiches" : "la fiche"} sur n'importe quel appareil avec « Importer ».</p>
    <div class="actions" style="flex-direction:column">
      <button class="btn btn-primary btn-block" id="dl">Télécharger ${esc(filename)}</button>
      <button class="btn btn-block" id="cp">Copier le texte</button>
      <button class="btn btn-quiet btn-block" data-action="close">Fermer</button>
    </div>`, panel => {
    panel.querySelector("#dl").addEventListener("click", async () => {
      const cap = await capP;
      if (cap){
        try { await cap.save({filename, data: json}); markExported(); toast("Fichier enregistré."); closeSheet(); }
        catch(err){ if (err && err.code !== "declined") toast("Téléchargement indisponible ici. Utilise « Copier le texte »."); }
        return;
      }
      try {
        const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
        const a = document.createElement("a"); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove(); markExported();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch(e){ toast("Téléchargement indisponible ici. Utilise « Copier le texte »."); }
    });
    panel.querySelector("#cp").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(json); markExported(); toast("Texte copié. Colle-le dans une note ou un message."); }
      catch(e){
        panel.innerHTML = `<h2>Copier le texte</h2><p class="hint">Sélectionne tout le texte ci-dessous et copie-le.</p>
          <textarea class="input" readonly style="min-height:14rem">${esc(json)}</textarea>
          <div class="actions"><button class="btn" data-action="close">Fermer</button></div>`;
        const ta = panel.querySelector("textarea"); ta.focus(); ta.select(); markExported();
      }
    });
  });
}

function importData(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ toast("Ce texte n'est pas une sauvegarde Miroir valide."); return false; }
  const list = Array.isArray(data && data.characters) ? data.characters
    : (data && data.abilities ? [data] : null);
  if (!list || !list.length){ toast("Aucun personnage trouvé dans cette sauvegarde."); return false; }
  const ids = new Set(chars.map(c => c.id));
  for (const raw of list){
    const c = migrate(raw);
    if (ids.has(c.id)) c.id = uid();
    ids.add(c.id); chars.push(c);
  }
  persist(); closeSheet(); render();
  toast(list.length > 1 ? list.length + " personnages importés." : "Personnage importé.");
  return true;
}
function sheetImport(){
  openSheet(`
    <h2>Importer</h2>
    <label class="field"><span>Depuis un fichier .json</span><input class="input" type="file" accept=".json,application/json" id="imp-file"></label>
    <label class="field"><span>Ou colle le texte d'une sauvegarde</span><textarea class="input" id="imp-text" placeholder='{"miroir":1, …}'></textarea></label>
    <div class="actions">
      <button class="btn" data-action="close">Annuler</button>
      <button class="btn btn-primary" id="imp-go">Importer le texte</button>
    </div>`, panel => {
    panel.querySelector("#imp-file").addEventListener("change", e => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => importData(String(r.result));
      r.onerror = () => toast("Lecture du fichier impossible.");
      r.readAsText(file);
    });
    panel.querySelector("#imp-go").addEventListener("click", () => {
      const t = panel.querySelector("#imp-text").value.trim();
      if (!t){ toast("Colle d'abord le texte de la sauvegarde."); return; }
      importData(t);
    });
  });
}

/* ================= Actions ================= */
const actions = {
  new: () => sheetNew(),
  open: t => { view = {screen:"sheet", id:t.dataset.id, tab:"stats", reveal:true}; render(); window.scrollTo(0,0); },
  back: () => { view = {screen:"list", id:null, tab:"stats"}; render(); window.scrollTo(0,0); },
  tab: t => { view.tab = t.dataset.tab; render(); window.scrollTo(0,0); },
  identity: () => sheetIdentity(),
  portrait: () => sheetPortrait(),
  score: t => sheetScore(t.dataset.ab),
  derived: t => sheetDerived(t.dataset.key),
  "cycle-save": t => { const c = current(); c.saves[t.dataset.ab] = !c.saves[t.dataset.ab]; touch(c); render(); },
  "cycle-skill": t => { const c = current(); const k = t.dataset.skill; c.skills[k] = ((c.skills[k]||0) + 1) % 3; touch(c); render(); },
  inspi: () => { const c = current(); c.heroicInspiration = !c.heroicInspiration; touch(c); render(); },
  exh: t => { const c = current(); c.exhaustion = clamp(c.exhaustion + (+t.dataset.delta), 0, 6); touch(c); render(); },
  "export-one": () => { const c = current(); sheetExport([c], "miroir-" + slug(c.name) + ".json"); },
  "export-all": () => sheetExport(chars, "miroir-sauvegarde.json"),
  import: () => sheetImport(),
  theme: () => { setTheme(THEME_NEXT[getTheme()]); render(); },
  "spell-add": () => sheetAddSpell(),
  "spell-toggle": t => {
    ensureSpellView(); const id = t.dataset.id;
    if (view.openSpells.has(id)) view.openSpells.delete(id); else view.openSpells.add(id);
    const el = $("#spell-list"); if (el) el.innerHTML = renderSpellList(current());
  },
  "spell-prep": t => {
    const c = current(); const s = c.spells.find(x => x.id === t.dataset.id); if (!s) return;
    if (s.always){ toast("Ce sort est toujours préparé. Modifie-le pour changer."); return; }
    s.prepared = !s.prepared; touch(c); render();
  },
  "spell-cast": t => sheetCast(t.dataset.id),
  "spell-edit": t => { const s = current().spells.find(x => x.id === t.dataset.id); s && sheetSpellForm(Object.assign({}, s), {}); },
  "spell-del": t => sheetDeleteSpell(t.dataset.id),
  sf: t => {
    ensureSpellView(); const f = view.sf, k = t.dataset.k, v = t.dataset.v;
    if (k === "lvl") f.lvl = (f.lvl === v ? "all" : v);
    else if (k === "time") f.time = (f.time === v ? "all" : v);
    else f[k] = !f[k];
    render();
  },
  "sf-reset": () => { view.sf = defaultSF(); render(); },
  slot: t => {
    const c = current(); const d = derive(c); const step = t.dataset.state === "avail" ? 1 : -1;
    if (t.dataset.kind === "pact") c.slots.pact = clamp(clamp(c.slots.pact, 0, d.pact.count) + step, 0, d.pact.count);
    else { const n = +t.dataset.lv, max = d.slots[n]; c.slots.used[n] = clamp(clamp(c.slots.used[n] || 0, 0, max) + step, 0, max); }
    touch(c); render();
  },
  "slots-adjust": () => sheetSlots(),
  "rest-short": () => sheetShortRest(),
  hd: t => {
    const c = current(), z = +t.dataset.z, p = hitDicePool(c).find(x => x.z === z); if (!p) return;
    c.hitDice[z] = clamp(p.used + (+t.dataset.d), 0, p.total); touch(c); render();
  },
  conds: () => sheetConds(),
  coin: t => sheetCoin(t.dataset.k),
  "item-add": () => sheetItem(null),
  "item-edit": t => sheetItem(t.dataset.id),
  "item-toggle": t => {
    view.openItems = view.openItems || new Set(); const id = t.dataset.id;
    if (view.openItems.has(id)) view.openItems.delete(id); else view.openItems.add(id);
    render();
  },
  "item-qty": t => {
    const c = current(); const it = c.inventory.find(x => x.id === t.dataset.id); if (!it) return;
    it.qty = clamp(it.qty + (+t.dataset.d), 0, 99999); touch(c); render();
  },
  "item-del": t => {
    const c = current(); const it = c.inventory.find(x => x.id === t.dataset.id); if (!it) return;
    sheetConfirm(`Supprimer « ${esc(it.name) || "Objet sans nom"} » ?`, "L'objet sera retiré du sac.", "Garder l'objet", "Supprimer", () => {
      c.inventory = c.inventory.filter(x => x.id !== it.id); touch(c); closeSheet(); render(); toast("Objet supprimé.");
    });
  },
  install: () => sheetInstall(),
  "rest-long": () => sheetLongRest(),
  "cast-ab": () => sheetCastAb(),
  "conc-info": () => sheetConc(),
  "conc-end": () => { const c = current(); const n = c.concentration && c.concentration.name; c.concentration = null; touch(c); render(); n && toast("Concentration sur " + n + " rompue."); },
  hp: t => sheetHP(t.dataset.mode),
  death: t => {
    const c = current(), ds = c.combat.death, k = t.dataset.k, i = +t.dataset.i;
    ds[k] = ds[k] === i + 1 ? i : i + 1;
    touch(c); render();
    if (k === "s" && ds.s === 3) toast("Trois réussites : tu es stable.");
    if (k === "f" && ds.f === 3) toast("Trois échecs : le personnage meurt.");
  },
  "death-20": () => {
    const c = current(), max = derive(c).out["hp.max"].value;
    c.combat.dmg = Math.max(0, max - 1); c.combat.death = {s:0, f:0};
    touch(c); render(); toast("20 naturel : tu reprends conscience avec 1 PV.");
  },
  turn: t => { const c = current(); c.combat.turn[t.dataset.k] = !c.combat.turn[t.dataset.k]; touch(c); render(); },
  "turn-new": () => { const c = current(); c.combat.turn = {a:false, b:false, r:false}; touch(c); render(); toast("Nouveau tour : action, action bonus et réaction disponibles."); },
  armor: () => sheetArmor(),
  "cb-toggle": t => {
    ensureCombatView(); const k = t.dataset.key;
    if (view.openCombat.has(k)) view.openCombat.delete(k); else view.openCombat.add(k);
    render();
  },
  "wpn-add": () => sheetWeapon(null),
  "wpn-edit": t => sheetWeapon(t.dataset.id),
  "wpn-del": t => {
    const c = current(); const w = c.combat.weapons.find(x => x.id === t.dataset.id); if (!w) return;
    sheetConfirm(`Supprimer « ${esc(w.name) || "Arme sans nom"} » ?`, "L'arme sera retirée de tes attaques.", "Garder l'arme", "Supprimer", () => {
      c.combat.weapons = c.combat.weapons.filter(x => x.id !== w.id); touch(c); closeSheet(); render(); toast("Arme supprimée.");
    });
  },
  "feat-add": () => sheetFeature(null),
  "feat-edit": t => sheetFeature(t.dataset.id),
  "feat-del": t => {
    const c = current(); const f = c.combat.features.find(x => x.id === t.dataset.id); if (!f) return;
    sheetConfirm(`Supprimer « ${esc(f.name) || "Capacité sans nom"} » ?`, "La capacité sera retirée de la fiche.", "Garder la capacité", "Supprimer", () => {
      c.combat.features = c.combat.features.filter(x => x.id !== f.id); touch(c); closeSheet(); render(); toast("Capacité supprimée.");
    });
  },
  "feat-use": t => {
    const c = current(); const f = c.combat.features.find(x => x.id === t.dataset.id); if (!f) return;
    f.used = clamp(f.used + (+t.dataset.spend), 0, f.max); touch(c); render();
  },
  "cspell-view": t => sheetSpellView(t.dataset.id),
  close: () => closeSheet()
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t || !actions[t.dataset.action]) return;
  if (t.closest(".panel") && !["close"].includes(t.dataset.action)) return; // actions internes aux feuilles
  actions[t.dataset.action](t, e);
});
document.addEventListener("input", e => {
  const k = e.target.dataset.input;
  if (k === "notes"){ const c = current(); if (c){ c.notes = e.target.value; touch(c); } }
  else if (k === "spell-q"){ ensureSpellView(); view.sf.q = e.target.value; const el = $("#spell-list"); if (el) el.innerHTML = renderSpellList(current()); }
  else if (k === "sf-school"){ ensureSpellView(); view.sf.school = e.target.value; render(); }
  else if (k === "sf-sort"){ ensureSpellView(); view.sf.sort = e.target.value; render(); }
});

/* ================= Démarrage ================= */
applyTheme(getTheme());
load();
try {
  const lv = JSON.parse(localStorage.getItem(VIEW_KEY) || "{}");
  if (lv && lv.id && chars.some(c => c.id === lv.id))
    view = {screen:"sheet", id:lv.id, tab: TABS.includes(lv.tab) ? lv.tab : "stats", reveal:false};
} catch(e){}
if (!storageOk) toast("Cet appareil bloque l'enregistrement. Pense à exporter tes fiches.");
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
render();
})();
</script>
